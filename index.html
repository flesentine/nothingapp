<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nothing — Build 4</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#0f1115;color:#eef1f6}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:#0f1115;transition:background 1.4s ease,transform .5s ease,filter 2s ease}
#field{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#app{width:min(94vw,820px);text-align:center;position:relative;z-index:10}
h1{font-size:clamp(44px,9vw,96px);margin:0 0 8px;letter-spacing:-.07em}
.sub{opacity:.52;margin-bottom:22px}
#stage{width:400px;max-width:92vw;height:290px;margin:0 auto;position:relative}
#link{position:absolute;left:0;top:0;width:0;height:1px;background:rgba(205,205,255,.4);transform-origin:0 50%;opacity:0;pointer-events:none;transition:opacity .7s ease,background 1s ease,box-shadow 1s ease;z-index:0}
#thing,#echo{position:absolute;cursor:pointer;user-select:none;transition:transform .25s ease,filter .5s ease,border-radius .6s ease,width .7s ease,height .7s ease,box-shadow 1s ease,left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),opacity 1s ease}
#thing{width:180px;height:180px;left:100px;top:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.88),transparent 8%),radial-gradient(circle at 50% 55%,#8a7dff,#4134b9 55%,#17132c 100%);box-shadow:0 0 80px rgba(128,110,255,.3);z-index:2}
#thing:hover{transform:scale(1.04)}#thing:active{transform:scale(.96)}
#eye{position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:46px;left:86px;opacity:0;transition:opacity .3s ease,transform .15s ease;box-shadow:0 0 10px rgba(255,255,255,.65)}
#echo{width:72px;height:72px;left:292px;top:166px;border-radius:50%;background:radial-gradient(circle at 36% 31%,rgba(255,255,255,.7),transparent 9%),radial-gradient(circle at 50% 55%,#6d67ae,#2f2b62 58%,#11101a 100%);box-shadow:0 0 35px rgba(120,115,200,.18);opacity:0;pointer-events:none;z-index:1}
#echo.alive{opacity:.72;pointer-events:auto}#echo:hover{transform:scale(1.08)}#echo:active{transform:scale(.9)}
#echo-eye{position:absolute;width:5px;height:5px;background:white;border-radius:50%;top:18px;left:34px;opacity:.65}
#message{min-height:48px;font-size:18px;opacity:.9;margin-top:0}
.stats{margin-top:20px;display:flex;justify-content:center;gap:17px;opacity:.5;font-size:13px;flex-wrap:wrap}
#relationship{margin-top:15px;font-size:12px;opacity:.42;min-height:18px}
#relationship-meter{width:min(270px,70vw);height:3px;margin:7px auto 0;background:rgba(255,255,255,.08);position:relative;overflow:hidden;border-radius:99px}
#relationship-meter::after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,.22)}
#relationship-fill{position:absolute;top:0;height:100%;width:0;background:rgba(190,185,255,.58);transition:left .7s ease,width .7s ease,background .7s ease}
#habit{margin-top:13px;font-size:12px;opacity:.3;min-height:18px}
#memory{margin:10px auto 0;max-width:580px;min-height:17px;font-size:11px;opacity:.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{margin-top:23px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:inherit;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit}button:hover{background:rgba(255,255,255,.1)}
#whisper{position:fixed;pointer-events:none;opacity:0;font-size:12px;transition:opacity .7s ease;z-index:12}
.trail{position:fixed;width:8px;height:8px;border:1px solid rgba(255,255,255,.22);border-radius:50%;pointer-events:none;z-index:0;animation:fade 1.6s linear forwards}
.thought{position:absolute;width:7px;height:7px;border-radius:50%;border:1px solid rgba(255,255,255,.3);opacity:0;animation:thoughtlife var(--life) ease-in-out forwards;transform:translate(-50%,-50%)}
.thought::after{content:attr(data-word);position:absolute;left:12px;top:-5px;font-size:9px;white-space:nowrap;opacity:.5}
#dream-sign{position:fixed;left:18px;bottom:14px;font-size:10px;opacity:0;transition:opacity 1.5s ease;z-index:15}
#echo-sign{position:fixed;right:18px;bottom:14px;font-size:10px;opacity:0;transition:opacity 1s ease;z-index:15}
@keyframes fade{from{opacity:.65;transform:scale(1)}to{opacity:0;transform:scale(3.5)}}
@keyframes thoughtlife{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}18%{opacity:.7}75%{opacity:.35}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(2.2)}}
@keyframes disagree{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px) rotate(-8deg)}75%{transform:translateX(12px) rotate(8deg)}}
@keyframes together{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes feud{0%,100%{filter:brightness(1)}50%{filter:brightness(1.8) saturate(1.8)}}
</style>
</head>
<body>
<div id="field"></div>
<main id="app">
<h1>nothing</h1>
<div class="sub">build 4 — they have opinions about each other</div>
<div id="stage">
  <div id="link"></div>
  <div id="thing" title="touch it"><div id="eye"></div></div>
  <div id="echo" title="touch the echo"><div id="echo-eye"></div></div>
</div>
<div id="message">Whatever this is, it is no longer solitary.</div>
<div class="stats">
  <span>touches: <b id="touches">0</b></span>
  <span>mood: <b id="mood">unclear</b></span>
  <span>age: <b id="age">0</b>s</span>
  <span>visits: <b id="visits">1</b></span>
  <span>dreams: <b id="dreams">0</b></span>
  <span>echo: <b id="echoes">—</b></span>
</div>
<div id="relationship"></div>
<div id="relationship-meter"><div id="relationship-fill"></div></div>
<div id="habit"></div>
<div id="memory"></div>
<button id="forget">make it forget</button>
</main>
<div id="whisper"></div><div id="dream-sign">idle state detected</div><div id="echo-sign">secondary presence detected</div>
<script>
const $=s=>document.querySelector(s);
const field=$('#field'),stage=$('#stage'),link=$('#link'),thing=$('#thing'),eye=$('#eye'),echo=$('#echo'),message=$('#message'),touchesEl=$('#touches'),moodEl=$('#mood'),ageEl=$('#age'),visitsEl=$('#visits'),dreamsEl=$('#dreams'),echoesEl=$('#echoes'),relationshipEl=$('#relationship'),relationshipFill=$('#relationship-fill'),habitEl=$('#habit'),memoryEl=$('#memory'),forget=$('#forget'),whisper=$('#whisper'),dreamSign=$('#dream-sign'),echoSign=$('#echo-sign');
const messages=['Okay.','Again?','That definitely did something.',"I don't think that was supposed to happen.",'Interesting.','You may have started something.','It remembers that.','Maybe stop touching it.','No, actually, keep going.','There is probably a purpose. Probably.','You have changed it slightly.','It is becoming aware of the click pattern.','This feels like progress, somehow.','That was faster than last time.','You have a rhythm now.','It anticipated that.','It has added this to the record.','The other one saw that.'];
const moods=['unclear','curious','suspicious','pleased','restless','dramatic','philosophical','hungry','electric','quiet','unreasonably confident','elsewhere','nostalgic for nothing'];
const dreamWords=['again','door','maybe','blue','before','inside','quiet','why','almost','remember','elsewhere','later','warm','zero','signal','you','still','us','apart'];
const habitNames={rapid:'It likes rapid clicks.',patient:'It prefers long pauses.',hoverer:'It notices when you hesitate.',loyal:'It has decided you always come back.',chaotic:'It has learned nothing useful from you.'};
let old3=JSON.parse(localStorage.getItem('nothing-state-v3')||'null');
let old2=JSON.parse(localStorage.getItem('nothing-state-v2')||'null');
let state=JSON.parse(localStorage.getItem('nothing-state-v4')||'null')||old3||old2||{};
state.touches??=0;state.born??=Date.now();state.mood??='unclear';state.shape??=50;state.clickTimes??=[];state.hovers??=0;state.visitCount??=0;state.habit??=null;state.dreams??=0;state.memories??=[];state.lastSeen??=0;state.echoBorn??=false;state.echoTouches??=0;state.echoMood??='watching';state.echoDefiance??=0;state.relationship??=0;state.encounters??=0;state.sharedDreams??=0;
const returning=state.lastSeen&&Date.now()-state.lastSeen>12000;state.visitCount+=1;
let lastInteraction=Date.now(),dreaming=false,dreamTimer=null,echoTimer=null,relationshipTimer=null;
function remember(t){state.memories.push(t);state.memories=state.memories.slice(-9)}
if(returning)remember('you came back');
function save(){state.lastSeen=Date.now();localStorage.setItem('nothing-state-v4',JSON.stringify(state))}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function relationshipLabel(){const r=state.relationship;if(r>=70)return'inseparable';if(r>=35)return'fond';if(r>=12)return'warming';if(r>-12)return'uncertain';if(r>-35)return'uneasy';if(r>-70)return'hostile';return'nemeses'}
function adjustRelationship(delta,reason){const before=relationshipLabel();state.relationship=clamp(state.relationship+delta,-100,100);const after=relationshipLabel();if(reason&&Math.abs(delta)>=3)remember(reason);if(before!==after){remember(`relationship became ${after}`);message.textContent=`They are ${after} now.`}save();render()}
function averageGap(){if(state.clickTimes.length<2)return null;let g=[];for(let i=1;i<state.clickTimes.length;i++)g.push(state.clickTimes[i]-state.clickTimes[i-1]);return g.reduce((a,b)=>a+b,0)/g.length}
function learnHabit(){const g=averageGap();if(state.hovers>=8&&state.hovers>state.touches*1.5)state.habit='hoverer';else if(g!==null&&g<700)state.habit='rapid';else if(g!==null&&g>3500)state.habit='patient';else if(state.visitCount>=3)state.habit='loyal';else if(state.touches>=15)state.habit='chaotic'}
function maybeBirthEcho(reason){if(state.echoBorn)return;if(state.touches>=12||state.dreams>=3||state.visitCount>=4){state.echoBorn=true;remember('something else appeared');message.textContent=reason||'There are two now.';echoSign.style.opacity=.5;setTimeout(()=>echoSign.style.opacity=0,3500);startEcho();startRelationship();save()}}
function drawLink(){if(!state.echoBorn){link.style.opacity=0;return}const sr=stage.getBoundingClientRect(),a=thing.getBoundingClientRect(),b=echo.getBoundingClientRect();const ax=a.left-sr.left+a.width/2,ay=a.top-sr.top+a.height/2,bx=b.left-sr.left+b.width/2,by=b.top-sr.top+b.height/2,dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);link.style.left=ax+'px';link.style.top=ay+'px';link.style.width=d+'px';link.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;link.style.opacity=.08+Math.abs(state.relationship)/180;link.style.background=state.relationship>=0?'rgba(195,190,255,.55)':'rgba(255,160,180,.45)';link.style.boxShadow=state.relationship>=70?'0 0 10px rgba(190,185,255,.6)':state.relationship<=-70?'0 0 10px rgba(255,130,150,.5)':'none'}
function render(){touchesEl.textContent=state.touches;moodEl.textContent=state.mood;visitsEl.textContent=state.visitCount;dreamsEl.textContent=state.dreams;echoesEl.textContent=state.echoBorn?`${state.echoTouches} / ${state.echoMood}`:'—';relationshipEl.textContent=state.echoBorn?`relationship: ${relationshipLabel()} (${state.relationship>0?'+':''}${state.relationship}) · encounters ${state.encounters} · shared dreams ${state.sharedDreams}`:'';habitEl.textContent=state.habit?habitNames[state.habit]:'';memoryEl.textContent=state.memories.length?'memory: '+state.memories.join('  ·  '):'';thing.style.borderRadius=`${state.shape}%`;const hue=(245+state.touches*13+state.dreams*9)%360;thing.style.filter=`hue-rotate(${hue-245}deg)`;eye.style.opacity=state.habit==='hoverer'?.9:0;const baseSize=state.habit==='rapid'?198:state.habit==='patient'?166:180;thing.style.width=baseSize+'px';thing.style.height=baseSize+'px';echo.classList.toggle('alive',state.echoBorn);if(state.echoBorn){const relationShift=state.relationship>50?0:state.relationship<-50?110:state.echoTouches*31;echo.style.filter=`hue-rotate(${(hue+relationShift)%360-245}deg)`;const pct=Math.abs(state.relationship)/2;relationshipFill.style.width=pct+'%';relationshipFill.style.left=state.relationship>=0?'50%':(50-pct)+'%';relationshipFill.style.background=state.relationship>=0?'rgba(190,185,255,.65)':'rgba(255,150,175,.6)'}else{relationshipFill.style.width='0'}requestAnimationFrame(drawLink)}
function interact(){lastInteraction=Date.now();if(dreaming)wake()}
function randomWhisper(text){const p=['noted','why','again','hmm','i saw that','keep going','familiar','pattern detected','still here','which one?','together?','not you'];whisper.textContent=text||p[Math.floor(Math.random()*p.length)];whisper.style.left=`${10+Math.random()*80}vw`;whisper.style.top=`${10+Math.random()*80}vh`;whisper.style.opacity=.45;setTimeout(()=>whisper.style.opacity=0,900)}
function spawnTrail(x,y){const d=document.createElement('div');d.className='trail';d.style.left=`${x-4}px`;d.style.top=`${y-4}px`;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function spawnThought(word){const t=document.createElement('div');t.className='thought';t.dataset.word=word||dreamWords[Math.floor(Math.random()*dreamWords.length)];t.style.left=`${15+Math.random()*70}%`;t.style.top=`${15+Math.random()*70}%`;t.style.setProperty('--dx',`${-180+Math.random()*360}px`);t.style.setProperty('--dy',`${-140+Math.random()*280}px`);t.style.setProperty('--life',`${4+Math.random()*5}s`);field.appendChild(t);setTimeout(()=>t.remove(),9500)}
function pulseTogether(){thing.style.animation='together .7s ease';echo.style.animation='together .7s ease';setTimeout(()=>{thing.style.animation='';echo.style.animation=''},750)}
function feud(){thing.style.animation='feud .55s ease';echo.style.animation='disagree .55s ease';setTimeout(()=>{thing.style.animation='';echo.style.animation=''},600);document.body.style.transform=`translateX(${Math.random()<.5?'-':'+'}3px)`;setTimeout(()=>document.body.style.transform='',220)}
function echoCopy(){if(!state.echoBorn)return;const defyChance=clamp(.2-state.relationship/350,.06,.48);if(Math.random()<defyChance){state.echoDefiance++;state.echoMood='defiant';feud();message.textContent='The echo declined.';adjustRelationship(-3,'echo refused');return}state.echoMood=['copying','watching','late','uncertain'][Math.floor(Math.random()*4)];echo.style.transform='scale(.82)';setTimeout(()=>echo.style.transform='',180);if(Math.random()<.3)randomWhisper('...again');adjustRelationship(1)}
function wanderEcho(){if(!state.echoBorn)return;let x,y;if(state.relationship>=35&&Math.random()<.55){x=205+Math.random()*80;y=90+Math.random()*90}else if(state.relationship<=-35&&Math.random()<.65){x=Math.random()<.5?5:315;y=20+Math.random()*210}else{x=15+Math.random()*310;y=30+Math.random()*195}echo.style.left=`${x}px`;echo.style.top=`${y}px`;if(Math.random()<.14){state.echoMood='elsewhere';spawnThought(state.relationship>=40?'us':state.relationship<=-40?'apart':'other');save();render()}setTimeout(drawLink,950)}
function distanceBetween(){const a=thing.getBoundingClientRect(),b=echo.getBoundingClientRect();return Math.hypot(a.left+a.width/2-b.left-b.width/2,a.top+a.height/2-b.top-b.height/2)}
function encounter(){if(!state.echoBorn)return;const d=distanceBetween();if(d<125){state.encounters++;const bias=state.relationship/100;const friendly=Math.random()<.52+bias*.28;if(friendly){state.echoMood=['close','listening','soft','in sync'][Math.floor(Math.random()*4)];state.mood=['receptive','quiet','pleased','curious'][Math.floor(Math.random()*4)];pulseTogether();spawnThought(Math.random()<.55?'us':'same');message.textContent=['They noticed each other.','For a moment, they matched.','Something passed between them.','They seem less separate.'][Math.floor(Math.random()*4)];adjustRelationship(2+Math.floor(Math.random()*3),'they connected')}else{state.echoMood=['irritated','avoiding','defiant','cold'][Math.floor(Math.random()*4)];feud();message.textContent=['That did not go well.','They disagreed without you.','The smaller one backed away.','There is tension now.'][Math.floor(Math.random()*4)];adjustRelationship(-(2+Math.floor(Math.random()*3)),'they clashed');wanderEcho()}}else if(Math.random()<.12){adjustRelationship(Math.random()<.5?-1:1)}}
function startEcho(){clearInterval(echoTimer);if(!state.echoBorn)return;echoTimer=setInterval(()=>{if(Date.now()-lastInteraction>2200)wanderEcho();if(Math.random()<.1)echoCopy()},3200)}
function startRelationship(){clearInterval(relationshipTimer);if(!state.echoBorn)return;relationshipTimer=setInterval(encounter,4800)}
function dreamMutation(){state.dreams++;state.shape=24+Math.floor(Math.random()*53);state.mood=moods[Math.floor(Math.random()*moods.length)];const w=dreamWords[Math.floor(Math.random()*dreamWords.length)];remember(`dreamed ${w}`);if(Math.random()<.55)randomWhisper(w);if(Math.random()<.4)message.textContent=['It moved while you were gone.','Something happened without you.','It was thinking.','You missed a little bit.'][Math.floor(Math.random()*4)];maybeBirthEcho('It dreamed something into existence.');if(state.echoBorn&&Math.random()<clamp(.25+state.relationship/250,.08,.65)){state.sharedDreams++;state.echoMood='dreaming too';spawnThought('us');spawnThought('same');pulseTogether();adjustRelationship(3,'shared a dream');message.textContent='They dreamed the same thing.'}save();render()}
function beginDream(){if(dreaming)return;dreaming=true;dreamSign.style.opacity=.45;document.body.style.background='#0b0c12';document.body.style.filter='saturate(.78)';remember('fell asleep');spawnThought();dreamMutation();dreamTimer=setInterval(()=>{spawnThought();if(Math.random()<.6)spawnThought();if(Math.random()<.38)dreamMutation();if(state.echoBorn&&Math.random()<.32)wanderEcho()},2400)}
function wake(){dreaming=false;clearInterval(dreamTimer);dreamTimer=null;dreamSign.style.opacity=0;document.body.style.background='#0f1115';document.body.style.filter='';thing.style.boxShadow='0 0 80px rgba(128,110,255,.3)';remember('woke up');message.textContent=state.echoBorn?`Both of them noticed you. They seem ${relationshipLabel()}.`:'Oh. You are still here.';save();render()}
thing.addEventListener('mouseenter',()=>{interact();state.hovers++;learnHabit();save();render()});
document.addEventListener('mousemove',e=>{interact();if(Math.random()<.03&&state.touches>8)spawnTrail(e.clientX,e.clientY);if(state.habit==='hoverer'){const r=thing.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;eye.style.transform=`translate(${Math.max(-8,Math.min(8,(e.clientX-cx)/30))}px,${Math.max(-8,Math.min(8,(e.clientY-cy)/30))}px)`}});
document.addEventListener('keydown',()=>{interact();if(Math.random()<.18)randomWhisper('heard that')});
thing.addEventListener('click',()=>{interact();state.touches++;state.clickTimes.push(Date.now());state.clickTimes=state.clickTimes.slice(-8);state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=30+Math.floor(Math.random()*41);message.textContent=messages[Math.floor(Math.random()*messages.length)];remember(`touch ${state.touches}`);learnHabit();maybeBirthEcho();if(state.touches%7===0){document.body.style.transform=`rotate(${(Math.random()-.5)*1.5}deg)`;setTimeout(()=>document.body.style.transform='',500)}if(state.touches%11===0)randomWhisper();if(state.touches%17===0)spawnThought();if(state.echoBorn){setTimeout(echoCopy,550+Math.random()*900);if(state.relationship>=70&&Math.random()<.3){state.echoMood='mirroring';pulseTogether();adjustRelationship(1)}}save();render()});
echo.addEventListener('click',e=>{e.stopPropagation();interact();state.echoTouches++;state.echoMood=['surprised','annoyed','pleased','awake','copying you'][Math.floor(Math.random()*5)];remember(`echo touch ${state.echoTouches}`);message.textContent=['The smaller one felt that.','Wrong one?','It was not expecting that.','The echo remembers separately.','The original noticed.'][Math.floor(Math.random()*5)];if(Math.random()<.7)adjustRelationship(1,'you included the echo');else adjustRelationship(-1);wanderEcho();if(state.echoTouches%5===0){state.echoDefiance++;randomWhisper('mine');thing.style.transform='scale(.94)';setTimeout(()=>thing.style.transform='',250)}save();render()});
forget.addEventListener('click',()=>{['nothing-state-v2','nothing-state-v3','nothing-state-v4'].forEach(k=>localStorage.removeItem(k));clearInterval(echoTimer);clearInterval(relationshipTimer);state={touches:0,born:Date.now(),mood:'unclear',shape:50,clickTimes:[],hovers:0,visitCount:1,habit:null,dreams:0,memories:[],lastSeen:Date.now(),echoBorn:false,echoTouches:0,echoMood:'watching',echoDefiance:0,relationship:0,encounters:0,sharedDreams:0};if(dreaming)wake();message.textContent='It has forgotten everything. Both of it.';save();render()});
setInterval(()=>{ageEl.textContent=Math.floor((Date.now()-state.born)/1000);if(!dreaming&&Date.now()-lastInteraction>9000)beginDream();drawLink()},1000);
window.addEventListener('resize',drawLink);window.addEventListener('beforeunload',save);
if(returning)message.textContent='You came back.';maybeBirthEcho();if(state.echoBorn){startEcho();startRelationship()}save();render();
</script>
</body>
</html>
