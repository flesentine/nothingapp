function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function remember(t){state.memories.push(t);state.memories=state.memories.slice(-13)}if(returning)remember('you came back');function save(){state.lastSeen=Date.now();localStorage.setItem('nothing-state-v9',JSON.stringify(state))}function relLabel(){let r=state.relationship;return r>=70?'inseparable':r>=35?'fond':r>=12?'warming':r>-12?'uncertain':r>-35?'uneasy':r>-70?'hostile':'nemeses'}function certainty(){return clamp(100-state.timelineDrift-state.disputes*3-state.failedFutures-state.identityDisputes*2,4,100)}function identityBalance(){let total=Math.max(1,state.thingClaim+state.echoClaim);return(state.echoClaim-state.thingClaim)/total}function identityLabel(){let b=identityBalance();if(Math.abs(b)<.08)return'identity deadlock';let winner=b>0?'smaller one':'larger one',strength=Math.abs(b);return strength>.55?winner+' is treated as original':strength>.28?winner+' has the stronger claim':winner+' is slightly more believable'}function whisperText(t){whisper.textContent=t;whisper.style.left=(8+Math.random()*84)+'vw';whisper.style.top=(8+Math.random()*82)+'vh';whisper.style.opacity=.5;setTimeout(()=>whisper.style.opacity=0,950)}function flashIt(t){flashText.textContent=t;flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show')}

function addPlace(type,name,x,y,strength=1){let p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type,originalType:type,name:name||names[type][Math.floor(Math.random()*names[type].length)],originalName:name||'',x:x??(8+Math.random()*84),y:y??(8+Math.random()*80),strength,visits:0,entered:0,created:Date.now(),portal:false,revisions:0,disputed:false,claimedBy:null};if(!p.originalName)p.originalName=p.name;state.places.push(p);state.places=state.places.slice(-34);remember('room kept '+p.name);save();renderPlaces();render();return p}function maybePortal(p){if(p.portal)return true;let chance=p.visits*.2+p.strength*.09+(p.type==='dream'?.16:0)+p.revisions*.08;if(chance>.62||Math.random()<chance*.16){p.portal=true;remember(p.name+' opened');save();renderPlaces();return true}return false}

function renderFutures(){futureField.innerHTML='';for(let f of state.futures){let n=document.createElement('div');n.className='future '+(f.believed?'believed ':'')+(f.status!=='pending'?f.status:'');n.dataset.text=f.text;n.style.left=f.x+'%';n.style.top=f.y+'%';n.style.opacity=f.status==='pending'?clamp(.25+f.prob*.65,.3,.9):.3;n.title=Math.round(f.prob*100)+'% · '+f.status;n.onclick=e=>{e.stopPropagation();believeFuture(f)};futureField.appendChild(n)}}
function adjustRel(n,why){state.relationship=clamp(state.relationship+n,-100,100);if(Math.abs(n)>=3&&why)remember(why);save();render()}
function render(){touchesEl.textContent=state.touches;echoTouchesEl.textContent=state.echoTouches;dreamsEl.textContent=state.dreams;retconsEl.textContent=state.retcons;futuresEl.textContent=state.futures.filter(f=>f.status==='pending').length;flipsEl.textContent=state.identityFlips;relationshipEl.textContent=state.echoBorn?'relationship: '+relLabel()+' ('+(state.relationship>0?'+':'')+state.relationship+') · encounters '+state.encounters:'';let bal=identityBalance(),pct=Math.min(50,Math.abs(bal)*50);identityEl.textContent='identity: '+identityLabel()+' · larger claim '+Math.round(state.thingClaim)+' · smaller claim '+Math.round(state.echoClaim)+' · disputes '+state.identityDisputes;identityFill.style.width=pct+'%';identityFill.style.left=bal>=0?'50%':(50-pct)+'%';identityFill.style.background=bal>=0?'rgba(170,205,255,.7)':'rgba(215,190,255,.7)';roomstatus.textContent='room: places '+state.places.length+' · portals '+state.places.filter(p=>p.portal).length+' · leaks '+state.leaks;timelineEl.textContent='history confidence '+certainty()+'% · disputes '+state.disputes+' · drift '+state.timelineDrift;let pending=state.futures.filter(f=>f.status==='pending').slice().sort((a,b)=>b.prob-a.prob),strong=pending[0];forecastEl.textContent=strong?'strongest future '+Math.round(strong.prob*100)+'%: '+strong.text:'the future is temporarily blank';memoryEl.textContent=state.memories.join(' · ');thing.style.borderRadius=state.shape+'%';echo.classList.toggle('alive',state.echoBorn);let rp=Math.abs(state.relationship)/2;fill.style.width=rp+'%';fill.style.left=state.relationship>=0?'50%':(50-rp)+'%';fill.style.background=state.relationship>=0?'rgba(190,185,255,.65)':'rgba(255,145,170,.6)';applyIdentityVisuals();requestAnimationFrame(drawLink)}
function drawLink(){if(!state.echoBorn){link.style.opacity=0;return}let s=stage.getBoundingClientRect(),a=thing.getBoundingClientRect(),b=echo.getBoundingClientRect(),ax=a.left-s.left+a.width/2,ay=a.top-s.top+a.height/2,bx=b.left-s.left+b.width/2,by=b.top-s.top+b.height/2,dx=bx-ax,dy=by-ay;link.style.left=ax+'px';link.style.top=ay+'px';link.style.width=Math.hypot(dx,dy)+'px';link.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';link.style.opacity=.08+Math.abs(state.relationship)/180;link.style.background=state.relationship>=0?'rgba(195,190,255,.5)':'rgba(255,150,175,.45)'}
function birthEcho(){if(state.echoBorn)return;if(state.touches>=7||state.dreams>=2||state.visitCount>=3){state.echoBorn=true;remember('something else appeared');addEvidence('thing',6,'the room remembers the larger one alone');startEcho();startRelationship();save();render()}}function startEcho(){clearInterval(echoTimer);if(!state.echoBorn)return;echoTimer=setInterval(()=>{if(inside.classList.contains('open'))return;let positive=state.relationship>20;if(positive){echo.style.left=(200+Math.random()*130)+'px';echo.style.top=(80+Math.random()*110)+'px'}else{echo.style.left=(15+Math.random()*390)+'px';echo.style.top=(30+Math.random()*190)+'px'}if(Math.random()<.15){state.echoMood=['watching','restless','elsewhere','claiming the beginning'][Math.floor(Math.random()*4)];if(state.echoMood==='claiming the beginning')addEvidence('echo',2,'it repeated the claim')}},3200)}
function encounter(){if(!state.echoBorn||inside.classList.contains('open'))return;state.encounters++;if(state.relationship>30&&Math.random()<.46){adjustRel(3,'they found each other');addPlace('warm')}else if(state.relationship<-25&&Math.random()<.46){adjustRel(-4,'they fought');addPlace('cold')}else adjustRel(Math.random()<.52?1:-1);if(Math.random()<.16){let weaker=state.thingClaim<state.echoClaim?'thing':'echo';addEvidence(weaker,2,'an encounter looked familiar')}if(Math.random()<.11&&Math.abs(identityBalance())<.15){state.identityDisputes++;whisperText('which one was first?')}save();render()}function startRelationship(){clearInterval(relationTimer);if(!state.echoBorn)return;relationTimer=setInterval(encounter,6500)}
function dream(){if(dreaming||inside.classList.contains('open'))return;dreaming=true;state.dreams++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=25+Math.floor(Math.random()*50);let w=words[Math.floor(Math.random()*words.length)];remember('dreamed '+w);if(Math.random()<.48)addPlace('dream',Math.random()<.4?'dream of '+w:null);if(Math.random()<.28)spawnFuture();if(Math.random()<.22)addEvidence(Math.random()<.5?'thing':'echo',4,'a dream remembered it first');document.body.style.filter='saturate(.72) brightness(.85)';save();render();dreamTimer=setTimeout(()=>{dreaming=false;document.body.style.filter='';msg.textContent='It woke up less sure who had the dream.'},3500)}function interact(){lastInteraction=Date.now();if(dreaming){clearTimeout(dreamTimer);dreaming=false;document.body.style.filter=''}}
thing.onclick=()=>{interact();state.touches++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=30+Math.floor(Math.random()*42);remember('larger touch '+state.touches);thing.classList.add('claiming');setTimeout(()=>thing.classList.remove('claiming'),800);addEvidence('thing',1.4,'you touched it directly');msg.textContent=state.identityOwner==='thing'?'The original claims this as evidence.':'The supposed echo claims this proves nothing.';if(state.touches%6===0)addPlace(Math.random()<.55?'warm':'dream');if(state.touches%5===0&&state.futures.filter(f=>f.status==='pending').length<5)spawnFuture();birthEcho();resolveDue();save();render()};echo.onclick=e=>{e.stopPropagation();interact();state.echoTouches++;echo.classList.add('claiming');setTimeout(()=>echo.classList.remove('claiming'),800);addEvidence('echo',2.2,'you chose it instead');state.echoMood=['surprised','annoyed','pleased','awake','insistent'][Math.floor(Math.random()*5)];adjustRel(Math.random()<.62?2:-2);if(state.echoTouches%4===0)addPlace(state.relationship>=0?'warm':'cold');if(state.echoTouches%5===0)spawnFuture('identity');resolveDue();save();render()};function resolveDue(){for(let f of state.futures.filter(x=>x.status==='pending'))if(state.touches+state.echoTouches>=f.dueTouches||Date.now()>=f.dueAt)resolveFuture(f)}document.onmousemove=()=>{if(!inside.classList.contains('open'))interact()}
function seedInside(){insideField.innerHTML='';for(let i=0;i<50;i++){let s=document.createElement('i');s.className='star';let z=1+Math.random()*4;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.opacity=.12+Math.random()*.5;s.style.setProperty('--s',(1+Math.random()*4)+'s');insideField.appendChild(s)}}function enterPlace(p){currentPlace=p;p.entered++;p.portal=true;state.portalTrips++;insideName.textContent=p.name;insideText.textContent=p.claimedBy?(p.claimedBy==='echo'?'The smaller one says this memory belongs to it.':'The larger one says this memory proves it was first.'):(p.type==='warm'?'This version remembers closeness.':p.type==='cold'?'This scar remembers separation.':'This dream is unsure whose memory it is.');insideHistory.textContent='current '+p.type+' · original '+p.originalType+' · revised '+p.revisions+'x · entered '+p.entered+'x'+(p.claimedBy?' · claimed by '+p.claimedBy:'');insideCount.textContent='history confidence '+certainty()+'% · identity '+identityLabel();inside.style.background=p.type==='cold'?'radial-gradient(circle,#25131d,#08090e 64%)':p.type==='dream'?'radial-gradient(circle,#102131,#08090e 66%)':'radial-gradient(circle,#1b1835,#08090e 66%)';seedInside();inside.classList.add('open');save()}
function reviseMemory(p){if(!p)return;let old=p.type,opts=['warm','cold','dream'].filter(t=>t!==old),next=opts[Math.floor(Math.random()*opts.length)];p.type=next;p.name=names[next][Math.floor(Math.random()*names[next].length)];p.revisions++;p.disputed=p.revisions>1||Math.random()<.45;state.retcons++;state.timelineDrift=clamp(state.timelineDrift+3+Math.floor(Math.random()*3),0,90);if(p.disputed)state.disputes++;state.revisionLog.push({at:Date.now(),place:p.id,from:old,to:next});state.revisionLog=state.revisionLog.slice(-24);flashIt('correction: '+p.name);insideName.textContent=p.name;insideText.textContent='The identity evidence changed with the memory.';if(Math.random()<.65){let side=Math.random()<.5?'thing':'echo';p.claimedBy=side;addEvidence(side,6,'a revised memory favored it')}if(Math.random()<.5)spawnFuture();save();renderPlaces();render()}$('#revise').onclick=()=>reviseMemory(currentPlace);$('#claim-memory').onclick=()=>{if(!currentPlace)return;let side=Math.random()<.5?'thing':'echo';currentPlace.claimedBy=side;currentPlace.disputed=true;state.disputes++;state.identityDisputes++;addEvidence(side,10,'a memory was claimed as proof');insideText.textContent=(side==='echo'?'The smaller one':'The larger one')+' now treats this place as evidence of being first.';insideHistory.textContent+=' · claimed by '+side;save();renderPlaces();render()};insideOrb.onclick=()=>{if(!currentPlace)return;currentPlace.strength=clamp(currentPlace.strength+.3,1,9);insideOrb.style.borderRadius=(20+Math.random()*60)+'%';if(Math.random()<.25){state.leaks++;insideCount.textContent='something attached itself to you'}if(Math.random()<.20)spawnFuture(Math.random()<.5?'identity':'identity-back');save()};function leavePlace(){if(!currentPlace)return;let p=currentPlace;if(state.leaks>0&&Math.random()<.5)addPlace(p.type==='cold'?'dream':p.type,'leak from '+p.name);msg.textContent='You left '+p.name+'. Both of them claim they remember it first.';currentPlace=null;inside.classList.remove('open');save();renderPlaces();render()}$('#leave').onclick=leavePlace;document.onkeydown=e=>{if(e.key==='Escape'&&inside.classList.contains('open'))leavePlace()}
$('#forget').onclick=()=>{for(let k of ['nothing-state-v2','nothing-state-v3','nothing-state-v4','nothing-state-v5','nothing-state-v6','nothing-state-v7','nothing-state-v8','nothing-state-v9'])localStorage.removeItem(k);clearInterval(echoTimer);clearInterval(relationTimer);state={touches:0,echoTouches:0,born:Date.now(),mood:'unclear',shape:50,visitCount:1,dreams:0,memories:[],lastSeen:Date.now(),echoBorn:false,echoMood:'watching',relationship:0,encounters:0,sharedDreams:0,places:[],portalTrips:0,leaks:0,retcons:0,disputes:0,timelineDrift:0,revisionLog:[],futures:[],futureSerial:0,fulfilledFutures:0,failedFutures:0,beliefs:0,identityOwner:'thing',thingClaim:70,echoClaim:30,identityFlips:0,identityDisputes:0,identityEvidence:[],lastIdentityFlip:0};inside.classList.remove('open');msg.textContent='Everything forgot who came first.';save();renderPlaces();renderFutures();render()};setInterval(()=>{if(!inside.classList.contains('open')&&Date.now()-lastInteraction>9000&&!dreaming)dream();resolveDue();let pending=state.futures.filter(f=>f.status==='pending');if(pending.length<2&&Math.random()<.045)spawnFuture();if(state.echoBorn&&Math.random()<.025)addEvidence(Math.random()<.5?'thing':'echo',1,'the room noticed a resemblance');if(state.retcons>2&&Math.random()<.018&&state.places.length){let p=state.places[Math.floor(Math.random()*state.places.length)];p.disputed=true;state.disputes++;state.timelineDrift=clamp(state.timelineDrift+1,0,90)}save();render()},1000);window.onbeforeunload=save;birthEcho();if(state.echoBorn){startEcho();startRelationship()}if(!state.futures.length)spawnFuture();renderPlaces();renderFutures();render();save();
</script>
