<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Nothing — Build 2</title>
  <style>
    :root {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: #0f1115;
      color: #eef1f6;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #0f1115;
      transition: background 1.4s ease, transform .5s ease, filter 2s ease;
    }
    #field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }
    #app {
      width: min(92vw, 780px);
      text-align: center;
      position: relative;
      z-index: 10;
    }
    h1 {
      font-size: clamp(44px, 9vw, 96px);
      margin: 0 0 8px;
      letter-spacing: -0.07em;
    }
    .sub {
      opacity: .52;
      margin-bottom: 34px;
    }
    #thing-wrap {
      width: 260px;
      height: 260px;
      margin: 0 auto 2px;
      display: grid;
      place-items: center;
      position: relative;
    }
    #thing {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.88), transparent 8%),
        radial-gradient(circle at 50% 55%, #8a7dff, #4134b9 55%, #17132c 100%);
      box-shadow: 0 0 80px rgba(128,110,255,.3);
      cursor: pointer;
      transition:
        transform .25s ease,
        filter .25s ease,
        border-radius .6s ease,
        width .7s ease,
        height .7s ease,
        box-shadow 1s ease;
      user-select: none;
      position: relative;
    }
    #thing:hover { transform: scale(1.04); }
    #thing:active { transform: scale(.96); }
    #eye {
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      top: 46px;
      left: 86px;
      opacity: 0;
      transition: opacity .3s ease, transform .15s ease;
      box-shadow: 0 0 10px rgba(255,255,255,.65);
    }
    #message {
      min-height: 48px;
      font-size: 18px;
      opacity: .9;
      margin-top: 6px;
    }
    .stats {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 20px;
      opacity: .5;
      font-size: 13px;
      flex-wrap: wrap;
    }
    #habit {
      margin-top: 17px;
      font-size: 12px;
      opacity: .34;
      min-height: 18px;
    }
    #memory {
      margin: 14px auto 0;
      max-width: 500px;
      min-height: 17px;
      font-size: 11px;
      opacity: .22;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      margin-top: 26px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.06);
      color: inherit;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: rgba(255,255,255,.1); }
    #whisper {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      font-size: 12px;
      transition: opacity .7s ease, transform 1.5s ease;
      z-index: 12;
    }
    .trail {
      position: fixed;
      width: 8px;
      height: 8px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: fade 1.6s linear forwards;
    }
    .thought {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.3);
      opacity: 0;
      animation: thoughtlife var(--life) ease-in-out forwards;
      transform: translate(-50%,-50%);
    }
    .thought::after {
      content: attr(data-word);
      position: absolute;
      left: 12px;
      top: -5px;
      font-size: 9px;
      white-space: nowrap;
      opacity: .5;
    }
    @keyframes fade {
      from { opacity: .65; transform: scale(1); }
      to { opacity: 0; transform: scale(3.5); }
    }
    @keyframes thoughtlife {
      0% { opacity: 0; transform: translate(-50%,-50%) scale(.3); }
      18% { opacity: .7; }
      75% { opacity: .35; }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(2.2);
      }
    }
    #dream-sign {
      position: fixed;
      left: 18px;
      bottom: 14px;
      font-size: 10px;
      opacity: 0;
      transition: opacity 1.5s ease;
      z-index: 15;
    }
  </style>
</head>
<body>
  <div id="field"></div>

  <main id="app">
    <h1>nothing</h1>
    <div class="sub">build 2 — apparently it dreams now</div>

    <div id="thing-wrap">
      <div id="thing" title="touch it">
        <div id="eye"></div>
      </div>
    </div>

    <div id="message">It remembers enough to be dangerous.</div>

    <div class="stats">
      <span>touches: <b id="touches">0</b></span>
      <span>mood: <b id="mood">unclear</b></span>
      <span>age: <b id="age">0</b>s</span>
      <span>visits: <b id="visits">1</b></span>
      <span>dreams: <b id="dreams">0</b></span>
    </div>

    <div id="habit"></div>
    <div id="memory"></div>

    <button id="forget">make it forget</button>
  </main>

  <div id="whisper"></div>
  <div id="dream-sign">idle state detected</div>

  <script>
    const $ = s => document.querySelector(s);
    const field = $('#field');
    const thing = $('#thing');
    const eye = $('#eye');
    const message = $('#message');
    const touchesEl = $('#touches');
    const moodEl = $('#mood');
    const ageEl = $('#age');
    const visitsEl = $('#visits');
    const dreamsEl = $('#dreams');
    const habitEl = $('#habit');
    const memoryEl = $('#memory');
    const forget = $('#forget');
    const whisper = $('#whisper');
    const dreamSign = $('#dream-sign');

    const messages = [
      'Okay.', 'Again?', 'That definitely did something.',
      "I don't think that was supposed to happen.", 'Interesting.',
      'You may have started something.', 'It remembers that.',
      'Maybe stop touching it.', 'No, actually, keep going.',
      'There is probably a purpose. Probably.', 'You have changed it slightly.',
      'It is becoming aware of the click pattern.', 'This feels like progress, somehow.',
      'That was faster than last time.', 'You have a rhythm now.',
      'It anticipated that.', 'It has added this to the record.',
      'That changed the dream a little.'
    ];

    const moods = [
      'unclear','curious','suspicious','pleased','restless','dramatic',
      'philosophical','hungry','electric','quiet','unreasonably confident',
      'elsewhere','nostalgic for nothing'
    ];

    const dreamWords = [
      'again','door','maybe','blue','before','inside','quiet','why','almost',
      'remember','elsewhere','later','warm','zero','signal','you','still'
    ];

    const habitNames = {
      rapid: 'It likes rapid clicks.',
      patient: 'It prefers long pauses.',
      hoverer: 'It notices when you hesitate.',
      loyal: 'It has decided you always come back.',
      chaotic: 'It has learned nothing useful from you.'
    };

    let state = JSON.parse(localStorage.getItem('nothing-state-v2') || '{}');
    state.touches ??= 0;
    state.born ??= Date.now();
    state.mood ??= 'unclear';
    state.shape ??= 50;
    state.clickTimes ??= [];
    state.hovers ??= 0;
    state.visitCount ??= 0;
    state.habit ??= null;
    state.dreams ??= 0;
    state.memories ??= [];
    state.lastSeen ??= 0;

    const returning = state.lastSeen && Date.now() - state.lastSeen > 12000;
    state.visitCount += 1;
    if (returning) remember('you came back');

    let lastInteraction = Date.now();
    let dreaming = false;
    let dreamTimer = null;

    function remember(text) {
      state.memories.push(text);
      state.memories = state.memories.slice(-7);
    }

    function save() {
      state.lastSeen = Date.now();
      localStorage.setItem('nothing-state-v2', JSON.stringify(state));
    }

    function averageGap() {
      if (state.clickTimes.length < 2) return null;
      const gaps = [];
      for (let i = 1; i < state.clickTimes.length; i++) gaps.push(state.clickTimes[i] - state.clickTimes[i-1]);
      return gaps.reduce((a,b)=>a+b,0) / gaps.length;
    }

    function learnHabit() {
      const gap = averageGap();
      if (state.hovers >= 8 && state.hovers > state.touches * 1.5) state.habit = 'hoverer';
      else if (gap !== null && gap < 700) state.habit = 'rapid';
      else if (gap !== null && gap > 3500) state.habit = 'patient';
      else if (state.visitCount >= 3) state.habit = 'loyal';
      else if (state.touches >= 15) state.habit = 'chaotic';
    }

    function render() {
      touchesEl.textContent = state.touches;
      moodEl.textContent = state.mood;
      visitsEl.textContent = state.visitCount;
      dreamsEl.textContent = state.dreams;
      habitEl.textContent = state.habit ? habitNames[state.habit] : '';
      memoryEl.textContent = state.memories.length ? 'memory: ' + state.memories.join('  ·  ') : '';

      thing.style.borderRadius = `${state.shape}%`;
      const hue = (245 + state.touches * 13 + state.dreams * 9) % 360;
      thing.style.filter = `hue-rotate(${hue - 245}deg)`;

      eye.style.opacity = state.habit === 'hoverer' ? .9 : 0;
      thing.style.width = state.habit === 'rapid' ? '198px' : state.habit === 'patient' ? '166px' : '180px';
      thing.style.height = thing.style.width;
    }

    function interact() {
      lastInteraction = Date.now();
      if (dreaming) wake();
    }

    function randomWhisper(text) {
      const phrases = ['noted','why','again','hmm','i saw that','keep going','familiar','pattern detected','still here'];
      whisper.textContent = text || phrases[Math.floor(Math.random()*phrases.length)];
      whisper.style.left = `${10 + Math.random()*80}vw`;
      whisper.style.top = `${10 + Math.random()*80}vh`;
      whisper.style.opacity = .45;
      setTimeout(() => whisper.style.opacity = 0, 900);
    }

    function spawnTrail(x,y) {
      const dot = document.createElement('div');
      dot.className = 'trail';
      dot.style.left = `${x-4}px`;
      dot.style.top = `${y-4}px`;
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 1700);
    }

    function spawnThought() {
      const thought = document.createElement('div');
      thought.className = 'thought';
      const word = dreamWords[Math.floor(Math.random()*dreamWords.length)];
      thought.dataset.word = word;
      thought.style.left = `${15 + Math.random()*70}%`;
      thought.style.top = `${15 + Math.random()*70}%`;
      thought.style.setProperty('--dx', `${-180 + Math.random()*360}px`);
      thought.style.setProperty('--dy', `${-140 + Math.random()*280}px`);
      thought.style.setProperty('--life', `${4 + Math.random()*5}s`);
      field.appendChild(thought);
      setTimeout(() => thought.remove(), 9500);
    }

    function dreamMutation() {
      state.dreams++;
      state.shape = 24 + Math.floor(Math.random()*53);
      state.mood = moods[Math.floor(Math.random()*moods.length)];
      const word = dreamWords[Math.floor(Math.random()*dreamWords.length)];
      remember(`dreamed ${word}`);

      const size = 145 + Math.floor(Math.random()*66);
      thing.style.width = `${size}px`;
      thing.style.height = `${size}px`;
      thing.style.boxShadow = `0 0 ${55 + Math.random()*100}px rgba(128,110,255,.${2 + Math.floor(Math.random()*4)})`;

      if (Math.random() < .55) randomWhisper(word);
      if (Math.random() < .45) message.textContent = ['It moved while you were gone.','Something happened without you.','It was thinking.','You missed a little bit.'][Math.floor(Math.random()*4)];

      save();
      render();
    }

    function beginDream() {
      if (dreaming) return;
      dreaming = true;
      dreamSign.style.opacity = .45;
      document.body.style.background = '#0b0c12';
      document.body.style.filter = 'saturate(.78)';
      remember('fell asleep');
      spawnThought();
      dreamMutation();
      dreamTimer = setInterval(() => {
        spawnThought();
        if (Math.random() < .6) spawnThought();
        if (Math.random() < .38) dreamMutation();
      }, 2400);
    }

    function wake() {
      dreaming = false;
      clearInterval(dreamTimer);
      dreamTimer = null;
      dreamSign.style.opacity = 0;
      document.body.style.background = '#0f1115';
      document.body.style.filter = '';
      thing.style.boxShadow = '0 0 80px rgba(128,110,255,.3)';
      remember('woke up');
      message.textContent = 'Oh. You are still here.';
      save();
      render();
    }

    thing.addEventListener('mouseenter', () => {
      interact();
      state.hovers++;
      learnHabit();
      save();
      render();
    });

    document.addEventListener('mousemove', e => {
      interact();
      if (Math.random() < .035 && state.touches > 8) spawnTrail(e.clientX,e.clientY);

      if (state.habit === 'hoverer') {
        const r = thing.getBoundingClientRect();
        const cx = r.left + r.width/2;
        const cy = r.top + r.height/2;
        const dx = (e.clientX-cx)/30;
        const dy = (e.clientY-cy)/30;
        eye.style.transform = `translate(${Math.max(-8,Math.min(8,dx))}px,${Math.max(-8,Math.min(8,dy))}px)`;
      }
    });

    document.addEventListener('keydown', () => {
      interact();
      if (Math.random() < .18) randomWhisper('heard that');
    });

    thing.addEventListener('click', () => {
      interact();
      state.touches++;
      state.clickTimes.push(Date.now());
      state.clickTimes = state.clickTimes.slice(-8);
      state.mood = moods[Math.floor(Math.random()*moods.length)];
      state.shape = 30 + Math.floor(Math.random()*41);
      message.textContent = messages[Math.floor(Math.random()*messages.length)];
      remember(`touch ${state.touches}`);
      learnHabit();

      if (state.touches % 7 === 0) {
        document.body.style.transform = `rotate(${(Math.random()-.5)*1.5}deg)`;
        setTimeout(() => document.body.style.transform = '', 500);
      }
      if (state.touches % 11 === 0) randomWhisper();
      if (state.touches % 17 === 0) spawnThought();

      save();
      render();
    });

    forget.addEventListener('click', () => {
      localStorage.removeItem('nothing-state-v2');
      state = {
        touches:0,born:Date.now(),mood:'unclear',shape:50,clickTimes:[],hovers:0,
        visitCount:1,habit:null,dreams:0,memories:[],lastSeen:Date.now()
      };
      if (dreaming) wake();
      message.textContent = 'It has forgotten everything.';
      save();
      render();
    });

    setInterval(() => {
      ageEl.textContent = Math.floor((Date.now()-state.born)/1000);
      if (!dreaming && Date.now()-lastInteraction > 9000) beginDream();
    }, 1000);

    window.addEventListener('beforeunload', save);

    if (returning) message.textContent = 'You came back.';
    save();
    render();
  </script>
</body>
</html>
