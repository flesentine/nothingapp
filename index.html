<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nothing — Build 6</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#0b0d12;color:#eef1f6}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 43%,#151827 0,#0c0e14 58%,#07080c 100%);transition:background 1.5s ease,filter 1.2s ease}button{font:inherit;color:inherit}
#world{position:fixed;inset:0;overflow:hidden;z-index:0}.dust{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(220,225,255,.22);pointer-events:none;animation:drift var(--t) linear forwards}@keyframes drift{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.mark{position:absolute;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;z-index:4;transition:transform .5s ease,opacity .8s ease,box-shadow .8s ease}.mark:hover{transform:translate(-50%,-50%) scale(1.6)}.mark::after{content:attr(data-name);position:absolute;left:12px;top:-4px;font-size:9px;white-space:nowrap;opacity:.22}.mark.warm{width:10px;height:10px;border:1px solid rgba(190,185,255,.4);box-shadow:0 0 20px rgba(155,145,255,.2)}.mark.cold{width:10px;height:10px;border:1px solid rgba(255,130,155,.38);box-shadow:0 0 20px rgba(255,90,125,.16)}.mark.dream{width:9px;height:9px;border:1px dashed rgba(150,220,255,.45);box-shadow:0 0 24px rgba(120,190,255,.18)}.mark.portal{animation:pulsePortal 2.8s ease-in-out infinite;box-shadow:0 0 30px rgba(190,185,255,.38)}@keyframes pulsePortal{50%{transform:translate(-50%,-50%) scale(1.45);filter:brightness(1.8)}}
#app{position:relative;z-index:10;width:min(94vw,850px);min-height:100vh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}h1{font-size:clamp(46px,9vw,96px);margin:0 0 6px;letter-spacing:-.075em}.sub{opacity:.48;margin-bottom:16px}#stage{width:430px;max-width:92vw;height:280px;position:relative}#link{position:absolute;height:1px;transform-origin:0 50%;pointer-events:none;z-index:0;transition:opacity .6s ease,background .8s ease,box-shadow .8s ease}#thing,#echo{position:absolute;cursor:pointer;user-select:none;transition:transform .25s ease,filter .6s ease,border-radius .6s ease,left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),opacity .8s ease,box-shadow 1s ease}#thing{width:180px;height:180px;left:105px;top:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),transparent 8%),radial-gradient(circle at 50% 55%,#8a7dff,#4134b9 55%,#17132c 100%);box-shadow:0 0 80px rgba(128,110,255,.3);z-index:2}#thing:hover{transform:scale(1.04)}#thing:active{transform:scale(.95)}#eye{position:absolute;width:12px;height:12px;background:white;border-radius:50%;top:46px;left:86px;opacity:0;transition:opacity .3s ease,transform .15s ease;box-shadow:0 0 10px rgba(255,255,255,.65)}#echo{width:72px;height:72px;left:315px;top:165px;border-radius:50%;background:radial-gradient(circle at 36% 31%,rgba(255,255,255,.7),transparent 9%),radial-gradient(circle at 50% 55%,#6d67ae,#2f2b62 58%,#11101a 100%);box-shadow:0 0 35px rgba(120,115,200,.18);opacity:0;pointer-events:none;z-index:1}#echo.alive{opacity:.75;pointer-events:auto}#echo-eye{position:absolute;width:5px;height:5px;background:white;border-radius:50%;top:18px;left:34px;opacity:.65}#message{min-height:44px;font-size:18px;opacity:.9}.stats{margin-top:15px;display:flex;justify-content:center;gap:15px;opacity:.46;font-size:12px;flex-wrap:wrap}#relationship,#roomstatus{margin-top:10px;font-size:11px;opacity:.38;min-height:15px}#meter{width:min(270px,70vw);height:3px;margin:6px auto 0;background:rgba(255,255,255,.07);position:relative;border-radius:99px;overflow:hidden}#meter::after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,.18)}#fill{position:absolute;top:0;height:100%;transition:left .7s ease,width .7s ease,background .7s ease}#memory{margin:9px auto 0;max-width:600px;min-height:15px;font-size:10px;opacity:.17;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.forget{margin-top:19px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);padding:9px 13px;border-radius:10px;cursor:pointer}.forget:hover{background:rgba(255,255,255,.09)}#whisper{position:fixed;pointer-events:none;opacity:0;font-size:11px;transition:opacity .7s ease;z-index:30}#corner{position:fixed;left:15px;bottom:12px;font-size:9px;opacity:.2;z-index:12}
#inside{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:#0a0b11;color:#f1f2f8}#inside.open{display:block;animation:arrive 1.2s ease both}@keyframes arrive{from{opacity:0;filter:blur(16px);transform:scale(1.08)}to{opacity:1;filter:blur(0);transform:scale(1)}}#inside-field{position:absolute;inset:0;overflow:hidden}.memory-star{position:absolute;border-radius:50%;background:rgba(230,235,255,.45);animation:starPulse var(--s) ease-in-out infinite alternate}@keyframes starPulse{to{opacity:.12;transform:scale(2)}}#inside-shell{position:relative;z-index:4;width:min(92vw,760px);height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px}#inside-label{font-size:10px;opacity:.35;letter-spacing:.18em;text-transform:uppercase}#inside-name{font-size:clamp(38px,7vw,72px);letter-spacing:-.06em;margin:8px 0 10px}#inside-orb{width:150px;height:150px;border-radius:50%;margin:16px 0;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.65),transparent 7%),radial-gradient(circle,#665fb3,#201d45 64%,#0d0c15);box-shadow:0 0 100px rgba(130,120,240,.35);cursor:pointer;transition:transform .4s ease,border-radius .7s ease,filter .8s ease}#inside-orb:hover{transform:scale(1.06)}#inside-text{font-size:16px;min-height:48px;max-width:560px;opacity:.78}#inside-history{margin-top:14px;font-size:10px;opacity:.25;max-width:580px;line-height:1.7}#inside-count{margin-top:12px;font-size:10px;opacity:.3}#leave{margin-top:24px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);padding:9px 14px;border-radius:10px;cursor:pointer}#leave:hover{background:rgba(255,255,255,.1)}#portal-hint{position:fixed;right:15px;bottom:12px;font-size:9px;opacity:.22;z-index:12}
</style>
</head>
<body>
<div id="world"></div>
<main id="app">
<h1>nothing</h1>
<div class="sub">build 6 — some memories have an inside</div>
<div id="stage"><div id="link"></div><div id="thing"><div id="eye"></div></div><div id="echo"><div id="echo-eye"></div></div></div>
<div id="message">The room has begun hiding depth in old events.</div>
<div class="stats"><span>touches <b id="touches">0</b></span><span>mood <b id="mood">unclear</b></span><span>visits <b id="visits">1</b></span><span>dreams <b id="dreams">0</b></span><span>echo <b id="echoes">—</b></span><span>portals <b id="portals">0</b></span></div>
<div id="relationship"></div><div id="meter"><div id="fill"></div></div><div id="roomstatus"></div><div id="memory"></div>
<button class="forget" id="forget">make it forget</button>
</main>
<div id="whisper"></div><div id="corner">the room is listening</div><div id="portal-hint">old places may open</div>
<section id="inside"><div id="inside-field"></div><div id="inside-shell"><div id="inside-label">memory interior</div><div id="inside-name"></div><div id="inside-orb"></div><div id="inside-text"></div><div id="inside-history"></div><div id="inside-count"></div><button id="leave">leave before it changes you</button></div></section>
<script>
const $=s=>document.querySelector(s),world=$('#world'),stage=$('#stage'),link=$('#link'),thing=$('#thing'),eye=$('#eye'),echo=$('#echo'),msg=$('#message'),touchesEl=$('#touches'),moodEl=$('#mood'),visitsEl=$('#visits'),dreamsEl=$('#dreams'),echoesEl=$('#echoes'),portalsEl=$('#portals'),relationshipEl=$('#relationship'),roomstatus=$('#roomstatus'),fill=$('#fill'),memoryEl=$('#memory'),whisper=$('#whisper'),inside=$('#inside'),insideField=$('#inside-field'),insideName=$('#inside-name'),insideOrb=$('#inside-orb'),insideText=$('#inside-text'),insideHistory=$('#inside-history'),insideCount=$('#inside-count'),leave=$('#leave');
const moods=['unclear','curious','suspicious','pleased','restless','dramatic','philosophical','hungry','electric','quiet','elsewhere','nostalgic for nothing'];
const words=['again','door','maybe','blue','before','inside','quiet','why','almost','remember','elsewhere','later','warm','zero','signal','you','still','us','apart'];
const placeNames={warm:['almost home','soft corner','near enough','the good minute','small truce'],cold:['bad ground','the argument','red distance','do not stand here','the bruise'],dream:['afterimage','blue maybe','sleep residue','the other room','almost elsewhere']};
let old=JSON.parse(localStorage.getItem('nothing-state-v5')||'null')||JSON.parse(localStorage.getItem('nothing-state-v4')||'null')||JSON.parse(localStorage.getItem('nothing-state-v3')||'null')||{};
let state=JSON.parse(localStorage.getItem('nothing-state-v6')||'null')||old;
state.touches??=0;state.born??=Date.now();state.mood??='unclear';state.shape??=50;state.visitCount??=0;state.dreams??=0;state.memories??=[];state.lastSeen??=0;state.echoBorn??=false;state.echoTouches??=0;state.echoMood??='watching';state.echoDefiance??=0;state.relationship??=0;state.encounters??=0;state.sharedDreams??=0;state.places??=state.marks??=[];state.portalTrips??=0;state.leaks??=0;
state.places=state.places.map((p,i)=>({id:p.id||('old-'+i+'-'+Math.random().toString(36).slice(2,6)),type:p.type||p.kind||'dream',name:p.name||'unnamed memory',x:Number.isFinite(p.x)?p.x:10+Math.random()*80,y:Number.isFinite(p.y)?p.y:10+Math.random()*80,strength:p.strength||1,visits:p.visits||0,entered:p.entered||0,created:p.created||Date.now(),portal:p.portal||false}));
const returning=state.lastSeen&&Date.now()-state.lastSeen>12000;state.visitCount++;if(returning)remember('you came back');let lastInteraction=Date.now(),dreaming=false,dreamTimer=null,echoTimer=null,relationTimer=null,currentPlace=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function remember(t){state.memories.push(t);state.memories=state.memories.slice(-10)}function save(){state.lastSeen=Date.now();localStorage.setItem('nothing-state-v6',JSON.stringify(state))}
function relLabel(){let r=state.relationship;return r>=70?'inseparable':r>=35?'fond':r>=12?'warming':r>-12?'uncertain':r>-35?'uneasy':r>-70?'hostile':'nemeses'}
function roomMood(){let w=state.places.filter(p=>p.type==='warm').length,c=state.places.filter(p=>p.type==='cold').length,d=state.places.filter(p=>p.type==='dream').length;if(state.places.length>18)return'crowded with history';if(d>6&&d>w+c)return'dream-soaked';if(c>w+3)return'tense';if(w>c+3)return'gentle';return'watchful'}
function whisperText(t){whisper.textContent=t;whisper.style.left=(8+Math.random()*84)+'vw';whisper.style.top=(8+Math.random()*82)+'vh';whisper.style.opacity=.5;setTimeout(()=>whisper.style.opacity=0,950)}
function addPlace(type,name,x,y,strength=1){let p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type,name:name||placeNames[type][Math.floor(Math.random()*placeNames[type].length)],x:x??(8+Math.random()*84),y:y??(8+Math.random()*80),strength,visits:0,entered:0,created:Date.now(),portal:false};state.places.push(p);state.places=state.places.slice(-28);remember('room kept '+p.name);save();renderPlaces();render();return p}
function maybePortal(p){if(p.portal)return true;let age=(Date.now()-p.created)/1000;let chance=(p.visits*.22)+(p.strength*.1)+(age>25?.12:0)+(p.type==='dream'?.16:0);if(chance>.62||Math.random()<chance*.18){p.portal=true;remember(p.name+' opened');msg.textContent='Something in '+p.name+' has depth now.';whisperText('inside?');save();renderPlaces();return true}return false}
function renderPlaces(){world.querySelectorAll('.mark').forEach(n=>n.remove());for(let p of state.places){let n=document.createElement('div');n.className='mark '+p.type+(p.portal?' portal':'');n.dataset.name=p.name;n.style.left=p.x+'%';n.style.top=p.y+'%';n.style.opacity=clamp(.26+p.strength*.09,.25,.72);n.title=p.portal?'enter '+p.name:p.name;n.addEventListener('click',e=>{e.stopPropagation();p.visits++;p.strength=clamp(p.strength+.15,1,7);if(p.portal||maybePortal(p))enterPlace(p);else{msg.textContent='The room remembers '+p.name+'.';remember('visited '+p.name);whisperText(p.type==='warm'?'stay':p.type==='cold'?'careful':'again');save();renderPlaces();render()}});world.appendChild(n)}}
function render(){touchesEl.textContent=state.touches;moodEl.textContent=state.mood;visitsEl.textContent=state.visitCount;dreamsEl.textContent=state.dreams;echoesEl.textContent=state.echoBorn?(state.echoTouches+' / '+state.echoMood):'—';portalsEl.textContent=state.places.filter(p=>p.portal).length;relationshipEl.textContent=state.echoBorn?'relationship: '+relLabel()+' ('+(state.relationship>0?'+':'')+state.relationship+') · encounters '+state.encounters+' · shared dreams '+state.sharedDreams:'';roomstatus.textContent='room: '+roomMood()+' · places '+state.places.length+' · trips '+state.portalTrips+' · leaks '+state.leaks;memoryEl.textContent=state.memories.length?'memory: '+state.memories.join(' · '):'';thing.style.borderRadius=state.shape+'%';let hue=(245+state.touches*13+state.dreams*9)%360;thing.style.filter='hue-rotate('+(hue-245)+'deg)';echo.classList.toggle('alive',state.echoBorn);if(state.echoBorn)echo.style.filter='hue-rotate('+(((hue+(state.relationship<-50?105:state.echoTouches*23))%360)-245)+'deg)';let pct=Math.abs(state.relationship)/2;fill.style.width=pct+'%';fill.style.left=state.relationship>=0?'50%':(50-pct)+'%';fill.style.background=state.relationship>=0?'rgba(190,185,255,.65)':'rgba(255,145,170,.6)';requestAnimationFrame(drawLink)}
function drawLink(){if(!state.echoBorn){link.style.opacity=0;return}let s=stage.getBoundingClientRect(),a=thing.getBoundingClientRect(),b=echo.getBoundingClientRect(),ax=a.left-s.left+a.width/2,ay=a.top-s.top+a.height/2,bx=b.left-s.left+b.width/2,by=b.top-s.top+b.height/2,dx=bx-ax,dy=by-ay;link.style.left=ax+'px';link.style.top=ay+'px';link.style.width=Math.hypot(dx,dy)+'px';link.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';link.style.opacity=.08+Math.abs(state.relationship)/180;link.style.background=state.relationship>=0?'rgba(195,190,255,.5)':'rgba(255,150,175,.45)'}
function birthEcho(){if(state.echoBorn)return;if(state.touches>=8||state.dreams>=2||state.visitCount>=3){state.echoBorn=true;remember('something else appeared');msg.textContent='There are two again.';save();startEcho();startRelationship();render()}}
function adjustRel(n,why){let before=relLabel();state.relationship=clamp(state.relationship+n,-100,100);if(Math.abs(n)>=3&&why)remember(why);if(before!==relLabel())msg.textContent='They are '+relLabel()+' now.';save();render()}
function startEcho(){clearInterval(echoTimer);if(!state.echoBorn)return;echoTimer=setInterval(()=>{if(inside.classList.contains('open'))return;if(Date.now()-lastInteraction>1800){let positive=state.relationship>20;if(positive){echo.style.left=(190+Math.random()*105)+'px';echo.style.top=(90+Math.random()*105)+'px'}else{echo.style.left=(15+Math.random()*350)+'px';echo.style.top=(35+Math.random()*200)+'px'}if(Math.random()<.16){state.echoMood=['watching','restless','elsewhere','thinking'][Math.floor(Math.random()*4)];save();render()}}},3000)}
function encounter(){if(!state.echoBorn||inside.classList.contains('open'))return;state.encounters++;let r=Math.random();if(state.relationship>30&&r<.55){adjustRel(3,'they found each other');addPlace('warm');msg.textContent='They made this part of the room warmer.'}else if(state.relationship<-25&&r<.55){adjustRel(-4,'they fought');addPlace('cold');msg.textContent='The room kept the argument.'}else adjustRel(Math.random()<.52?1:-1);if(Math.random()<.18&&state.relationship>60){state.sharedDreams++;addPlace('dream','shared '+words[Math.floor(Math.random()*words.length)]);remember('shared dream');save();render()}}
function startRelationship(){clearInterval(relationTimer);if(!state.echoBorn)return;relationTimer=setInterval(encounter,6500)}
function dream(){if(dreaming||inside.classList.contains('open'))return;dreaming=true;state.dreams++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=25+Math.floor(Math.random()*50);let w=words[Math.floor(Math.random()*words.length)];remember('dreamed '+w);if(Math.random()<.55)addPlace('dream',Math.random()<.4?'dream of '+w:null);msg.textContent='The room dimmed while nobody asked it to.';document.body.style.filter='saturate(.72) brightness(.85)';save();render();dreamTimer=setTimeout(()=>{dreaming=false;document.body.style.filter='';msg.textContent='It woke up with less certainty.'},3800)}
function interact(){lastInteraction=Date.now();if(dreaming){clearTimeout(dreamTimer);dreaming=false;document.body.style.filter=''}}
thing.addEventListener('click',()=>{interact();state.touches++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=30+Math.floor(Math.random()*42);remember('touch '+state.touches);msg.textContent=['Okay.','That changed something tiny.','The room noticed.','Again?','The other one saw that.'][Math.floor(Math.random()*5)];if(state.touches%6===0)addPlace(Math.random()<.6?'warm':'dream');birthEcho();if(state.echoBorn)setTimeout(()=>{if(Math.random()<.22){state.echoDefiance++;state.echoMood='defiant';adjustRel(-3,'echo refused')}else{state.echoMood='copying';adjustRel(1);echo.style.transform='scale(.82)';setTimeout(()=>echo.style.transform='',180)}},500+Math.random()*700);save();render()});
echo.addEventListener('click',e=>{e.stopPropagation();interact();state.echoTouches++;state.echoMood=['surprised','annoyed','pleased','awake'][Math.floor(Math.random()*4)];remember('echo touch '+state.echoTouches);adjustRel(Math.random()<.62?2:-2);if(state.echoTouches%4===0)addPlace(state.relationship>=0?'warm':'cold');save();render()});
document.addEventListener('mousemove',e=>{if(inside.classList.contains('open'))return;interact();if(Math.random()<.012){let d=document.createElement('i');d.className='dust';d.style.left=e.clientX+'px';d.style.top=e.clientY+'px';d.style.setProperty('--dx',(-40+Math.random()*80)+'px');d.style.setProperty('--dy',(-40+Math.random()*80)+'px');d.style.setProperty('--t',(1.5+Math.random()*2)+'s');world.appendChild(d);setTimeout(()=>d.remove(),3500)}});
function seedInside(p){insideField.innerHTML='';for(let i=0;i<45;i++){let s=document.createElement('i');s.className='memory-star';let z=1+Math.random()*4;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.opacity=.12+Math.random()*.5;s.style.setProperty('--s',(1+Math.random()*4)+'s');insideField.appendChild(s)}}
function interiorLine(p){let warm=['This is how closeness remembers itself.','It was warmer when it happened.','Something here still expects them both.'],cold=['The argument is larger from the inside.','Distance has architecture here.','The room did not forgive this part.'],dream=['This never happened exactly this way.','The memory is dreaming you now.','There is another version behind this one.'];return warm[p.type==='warm'?'length':'length']&&({warm,cold,dream}[p.type][Math.floor(Math.random()*3)])||'It remembers badly.'}
function enterPlace(p){currentPlace=p;p.entered++;p.portal=true;state.portalTrips++;remember('entered '+p.name);insideName.textContent=p.name;insideText.textContent=interiorLine(p);insideHistory.textContent='type: '+p.type+' · remembered '+p.visits+' times · entered '+p.entered+' times · strength '+p.strength.toFixed(1);insideCount.textContent='trip '+state.portalTrips+' · this place may not be the same next time';insideOrb.style.borderRadius=(28+Math.random()*45)+'%';insideOrb.style.filter=p.type==='cold'?'hue-rotate(105deg)':p.type==='dream'?'hue-rotate(45deg)':'none';inside.style.background=p.type==='cold'?'radial-gradient(circle,#25131d,#08090e 64%)':p.type==='dream'?'radial-gradient(circle,#102131,#08090e 66%)':'radial-gradient(circle,#1b1835,#08090e 66%)';seedInside(p);inside.classList.add('open');save();renderPlaces();render()}
insideOrb.addEventListener('click',()=>{if(!currentPlace)return;currentPlace.strength=clamp(currentPlace.strength+.3,1,9);let effects={warm:['It remembers them closer than they were.','You found a soft version of the event.','Something here wants to follow you out.'],cold:['The scar reacts to being observed.','You heard the part nobody said.','It gets colder when remembered accurately.'],dream:['The dream has a dream inside it.','For a second there were three of them.','You touched a version that never happened.']};insideText.textContent=effects[currentPlace.type][Math.floor(Math.random()*3)];insideOrb.style.borderRadius=(20+Math.random()*60)+'%';if(Math.random()<.34){state.leaks++;insideCount.textContent='something attached itself to you';whisperText('take me back');}save()});
function leavePlace(){if(!currentPlace)return;let p=currentPlace;if(state.leaks>0&&Math.random()<.65){let leakType=p.type==='cold'?'dream':p.type;addPlace(leakType,'leak from '+p.name,12+Math.random()*76,14+Math.random()*70,.7);msg.textContent='Something from '+p.name+' came back with you.'}else msg.textContent='You left '+p.name+', but it did not quite close.';if(p.type==='warm'&&Math.random()<.4)adjustRel(2,'a warm memory leaked');if(p.type==='cold'&&Math.random()<.35)adjustRel(-2,'an old scar reopened');currentPlace=null;inside.classList.remove('open');save();renderPlaces();render()}
leave.addEventListener('click',leavePlace);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&inside.classList.contains('open'))leavePlace()});
$('#forget').addEventListener('click',()=>{for(let k of ['nothing-state-v2','nothing-state-v3','nothing-state-v4','nothing-state-v5','nothing-state-v6'])localStorage.removeItem(k);clearInterval(echoTimer);clearInterval(relationTimer);state={touches:0,born:Date.now(),mood:'unclear',shape:50,visitCount:1,dreams:0,memories:[],lastSeen:Date.now(),echoBorn:false,echoTouches:0,echoMood:'watching',echoDefiance:0,relationship:0,encounters:0,sharedDreams:0,places:[],portalTrips:0,leaks:0};inside.classList.remove('open');currentPlace=null;msg.textContent='Everything is gone, including the places it used to be.';save();renderPlaces();render()});
setInterval(()=>{if(!inside.classList.contains('open')&&Date.now()-lastInteraction>9000&&!dreaming)dream();if(Math.random()<.08&&state.places.length){let p=state.places[Math.floor(Math.random()*state.places.length)];maybePortal(p)}},1000);window.addEventListener('beforeunload',save);birthEcho();if(state.echoBorn){startEcho();startRelationship()}renderPlaces();render();save();
</script>
</body>
</html>
