<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nothing — Build 11</title><style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#eef1f6;background:#07090e}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a1d31,#0a0c13 58%,#050609)}button{font:inherit;color:inherit;border:1px solid #ffffff20;background:#ffffff08;border-radius:9px;padding:8px 11px;cursor:pointer}#world,#futures,#letters{position:fixed;inset:0;overflow:hidden;pointer-events:none}.mark,.future,.letter{position:absolute;pointer-events:auto;cursor:pointer}.mark{width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #c6c2ff60;box-shadow:0 0 20px #8d82ff30}.mark.cold{border-color:#ff8ba760;box-shadow:0 0 20px #ff648030}.mark.dream{border-style:dashed;border-color:#8fdcff70}.mark::after,.future::after,.letter::after{content:attr(data-label);position:absolute;left:14px;top:-4px;font-size:8px;white-space:nowrap;opacity:.3}.future{width:8px;height:8px;border-radius:50%;border:1px solid #ffeaa080;box-shadow:0 0 24px #ffd87035;animation:pulse 2.5s ease-in-out infinite}.future.believed{box-shadow:0 0 35px #ffeaa070}.letter{width:12px;height:12px;transform:rotate(45deg);border:1px solid #b7ddff80;background:#7ec5ff0c;box-shadow:0 0 25px #7ec5ff35;animation:float 3s ease-in-out infinite}.letter.unknown{border-style:dashed;border-color:#e5c4ff99}.letter.read{opacity:.42;animation:none}@keyframes pulse{50%{transform:scale(1.5);filter:brightness(1.6)}}@keyframes float{50%{transform:rotate(45deg) translate(4px,-4px) scale(1.18)}}
#app{position:relative;z-index:10;width:min(94vw,900px);min-height:100vh;margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}h1{font-size:clamp(48px,9vw,96px);letter-spacing:-.08em;margin:0}.sub{opacity:.48;margin:5px 0 12px}#stage{width:460px;max-width:94vw;height:250px;position:relative}.being{position:absolute;border-radius:50%;cursor:pointer;transition:.7s;user-select:none}.being::after{content:attr(data-role);position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%);font-size:9px;white-space:nowrap;opacity:.3}#thing{width:180px;height:180px;left:112px;top:25px;background:radial-gradient(circle at 35% 30%,#fff,transparent 8%),radial-gradient(circle,#8a7dff,#4134b9 58%,#17132c);box-shadow:0 0 80px #806eff50}#echo{width:72px;height:72px;left:335px;top:145px;background:radial-gradient(circle at 36% 31%,#ffffffbb,transparent 9%),radial-gradient(circle,#6d67ae,#2f2b62 60%,#11101a);box-shadow:0 0 35px #7873c830}.stats{display:flex;gap:13px;flex-wrap:wrap;justify-content:center;font-size:11px;opacity:.45;margin-top:10px}#message{font-size:17px;min-height:38px}.line{font-size:10px;opacity:.38;margin-top:7px;min-height:13px}#controls{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;justify-content:center}#rift{position:fixed;right:18px;top:50%;width:18px;height:80px;border:1px solid #9fd8ff45;border-radius:50%;z-index:20;cursor:pointer;box-shadow:0 0 28px #65baff30;animation:rift 3s ease-in-out infinite}#rift::after{content:attr(data-label);position:absolute;right:27px;top:31px;font-size:9px;white-space:nowrap;opacity:.45}@keyframes rift{50%{height:100px;filter:brightness(1.5)}}
.panel{position:fixed;z-index:70;left:50%;bottom:20px;transform:translateX(-50%) translateY(150%);width:min(92vw,590px);background:#090b11f2;border:1px solid #ffffff20;border-radius:13px;padding:15px 17px;text-align:left;opacity:0;pointer-events:none;transition:.45s;box-shadow:0 18px 80px #0008}.panel.open{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}.panel .kicker{font-size:9px;opacity:.35;letter-spacing:.14em;text-transform:uppercase}.panel .body{font-size:15px;line-height:1.45;margin:8px 0}.panel .meta{font-size:9px;opacity:.25}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}#hint{position:fixed;left:14px;bottom:11px;font-size:9px;opacity:.22;z-index:11}
</style></head><body>
<div id="world"></div><div id="futures"></div><div id="letters"></div><div id="rift"></div>
<main id="app"><h1>nothing</h1><div class="sub">build 11 — the rooms have started writing to each other</div><div id="stage"><div id="thing" class="being"></div><div id="echo" class="being"></div></div><div id="message">There is handwriting near the rift.</div><div class="stats"><span>reality <b id="realityStat">A</b></span><span>touches <b id="touches">0</b></span><span>echo <b id="echoTouches">0</b></span><span>letters <b id="letterCount">0</b></span><span>unknown <b id="unknownCount">0</b></span><span>crossings <b id="crossings">0</b></span></div><div id="relationship" class="line"></div><div id="identity" class="line"></div><div id="timeline" class="line"></div><div id="forecast" class="line"></div><div id="correspondence" class="line"></div><div id="controls"><button id="signal">leave a note in the rift</button><button id="forget">make it forget</button></div></main>
<div id="hint">some letters have no matching send event</div>
<div id="letterPanel" class="panel"><div id="letterFrom" class="kicker"></div><div id="letterBody" class="body"></div><div id="letterMeta" class="meta"></div><div class="actions"><button id="keep">keep it</button><button id="reply">send something back</button><button id="reject">deny it</button><button id="closeLetter">close</button></div></div>
<div id="memoryPanel" class="panel"><div id="memoryTitle" class="kicker"></div><div id="memoryBody" class="body"></div><div id="memoryMeta" class="meta"></div><div class="actions"><button id="revise">remember differently</button><button id="claim">claim as origin proof</button><button id="crossMemory">follow other version</button><button id="closeMemory">leave</button></div></div>
<script>
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),clone=v=>JSON.parse(JSON.stringify(v));
const names={warm:['almost home','soft corner','near enough','small truce'],cold:['bad ground','the argument','red distance','the bruise'],dream:['afterimage','blue maybe','sleep residue','almost elsewhere']};
const lines={origin:['I remember arriving before you.','The labels are wrong on this side.','I was already here when the room split.'],relation:['We are kinder over here.','They are still fighting here.','Something between us survived the split.'],memory:['You are missing a place we still have.','One of your scars is warm over here.','I found the version you lost.'],future:['Your strongest future already happened here.','Do not believe the next prediction.','Tomorrow reached us first.'],rift:['The rift is thinner from this side.','I can see your room through the crack.','You left something here last time.']};
const nobody=['you already replied to this','there was never a reality A','stop reading messages I have not sent yet','one of us is not in either room','this was written after the rooms recombine','I remember the build after this one'];
const futureDefs=[['reconcile','they will forgive something',.55],['fight','they will make a new scar',.47],['identity','the echo will be remembered as the original',.34],['cross','you will end up in the other reality',.30],['message','a message will arrive that nobody remembers sending',.34],['portal','a memory will open',.36]];
const old=JSON.parse(localStorage.getItem('nothing-state-v11')||'null')||JSON.parse(localStorage.getItem('nothing-state-v10')||'null')||{};
function norm(r={}){return{touches:r.touches||0,echoTouches:r.echoTouches||0,relationship:r.relationship||0,thingClaim:r.thingClaim||70,echoClaim:r.echoClaim||30,identityOwner:r.identityOwner||'thing',places:(r.places||[]).map((p,i)=>({id:p.id||'p'+i,type:p.type||'dream',originalType:p.originalType||p.type||'dream',name:p.name||'unnamed memory',x:Number.isFinite(p.x)?p.x:10+Math.random()*80,y:Number.isFinite(p.y)?p.y:12+Math.random()*70,portal:!!p.portal,revisions:p.revisions||0,disputed:!!p.disputed,claimedBy:p.claimedBy||null})),futures:(r.futures||[]).map((f,i)=>({id:f.id||'f'+i,kind:f.kind||'message',text:f.text||'something will happen',prob:Number.isFinite(f.prob)?f.prob:.5,believed:f.believed||0,status:f.status||'pending',dueAt:f.dueAt||Date.now()+15000,x:Number.isFinite(f.x)?f.x:10+Math.random()*80,y:Number.isFinite(f.y)?f.y:12+Math.random()*70})),memories:(r.memories||[]).slice(-12),retcons:r.retcons||0,timelineDrift:r.timelineDrift||0,disputes:r.disputes||0,dreams:r.dreams||0,echoBorn:r.echoBorn!==false};}
let realities;if(old.realities&&old.realities.A&&old.realities.B)realities={A:norm(old.realities.A),B:norm(old.realities.B)};else{let a=norm(old),b=clone(a);b.relationship=clamp(b.relationship+(Math.random()<.5?-16:16),-100,100);b.timelineDrift+=5;b.echoClaim+=12;realities={A:a,B:b}};
let state={active:old.activeReality||'A',realities,crossings:old.realityCrossings||0,bleeds:old.realityBleeds||0,messages:old.crossMessages||[],messageSerial:old.messageSerial||0,unknown:old.unknownMessages||0,read:old.messagesRead||0,replies:old.messageReplies||0,currentMessage:null,currentMemory:null,lastInteraction:Date.now()};
function R(){return state.realities[state.active]}function O(){return state.realities[state.active==='A'?'B':'A']}function otherId(){return state.active==='A'?'B':'A'}function save(){localStorage.setItem('nothing-state-v11',JSON.stringify({...old,activeReality:state.active,realities:state.realities,realityCrossings:state.crossings,realityBleeds:state.bleeds,crossMessages:state.messages,messageSerial:state.messageSerial,unknownMessages:state.unknown,messagesRead:state.read,messageReplies:state.replies}))}
function identity(r=R()){let t=r.thingClaim,e=r.echoClaim;if(Math.abs(t-e)<9)return'identity deadlock';return(t>e?'larger':'smaller')+' one has the stronger origin claim'}function rel(r=R()){let x=r.relationship;return x>55?'inseparable':x>20?'fond':x>-20?'uncertain':x>-55?'hostile':'nemeses'}function certainty(r=R()){return clamp(100-r.timelineDrift-r.disputes*3,4,100)}function remember(t,r=R()){r.memories.push(t);r.memories=r.memories.slice(-12)}
function evidence(side,n,why){let r=R();if(side==='thing')r.thingClaim=clamp(r.thingClaim+n,1,240);else r.echoClaim=clamp(r.echoClaim+n,1,240);let before=r.identityOwner;r.identityOwner=r.echoClaim>r.thingClaim?'echo':'thing';if(before!==r.identityOwner&&Math.abs(r.echoClaim-r.thingClaim)>18){r.timelineDrift+=4;$('#message').textContent='The room changed its mind about which one was original.'}remember(why)}
function addPlace(type,name,r=R()){let p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),type,originalType:type,name:name||names[type][Math.floor(Math.random()*names[type].length)],x:8+Math.random()*84,y:12+Math.random()*72,portal:Math.random()<.2,revisions:0,disputed:false,claimedBy:null};r.places.push(p);r.places=r.places.slice(-34);remember('room kept '+p.name,r);return p}
function spawnFuture(kind,r=R()){let d=kind?futureDefs.find(x=>x[0]===kind):futureDefs[Math.floor(Math.random()*futureDefs.length)];if(!d)return;let f={id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),kind:d[0],text:d[1],prob:clamp(d[2]+(100-certainty(r))/250+(Math.random()-.5)*.12,.15,.94),believed:0,status:'pending',dueAt:Date.now()+9000+Math.random()*18000,x:8+Math.random()*84,y:12+Math.random()*72};r.futures.push(f);r.futures=r.futures.slice(-14);remember('future appeared: '+f.text,r)}
function resolveFuture(f,r=R()){if(f.status!=='pending')return;let ok=Math.random()<f.prob;f.status=ok?'fulfilled':'failed';if(!ok){r.timelineDrift+=2;return}if(f.kind==='reconcile')r.relationship=clamp(r.relationship+9,-100,100);if(f.kind==='fight'){r.relationship=clamp(r.relationship-9,-100,100);addPlace('cold','the predicted scar',r)}if(f.kind==='identity'){r.echoClaim+=18;r.identityOwner=r.echoClaim>r.thingClaim?'echo':'thing'}if(f.kind==='cross')cross();if(f.kind==='message')forge(state.active);if(f.kind==='portal'){let p=addPlace('dream','the place that arrived early',r);p.portal=true}}
function makeMessage(from,to,source,kind,replyTo){kind=kind||['origin','relation','memory','future','rift'][Math.floor(Math.random()*5)];let payload={};if(kind==='relation')payload.relationship=source.relationship;if(kind==='memory'&&source.places.length)payload.place=clone(source.places[Math.floor(Math.random()*source.places.length)]);if(kind==='future'&&source.futures.length)payload.future=clone(source.futures[Math.floor(Math.random()*source.futures.length)]);let m={id:'m'+(++state.messageSerial)+'-'+Date.now().toString(36),from,to,author:source.identityOwner,text:lines[kind][Math.floor(Math.random()*lines[kind].length)],kind,payload,created:Date.now(),arriveAt:Date.now()+1200+Math.random()*5000,status:'inflight',read:false,kept:false,forged:false,replyTo:replyTo||null,x:10+Math.random()*80,y:14+Math.random()*68};state.messages.push(m);state.messages=state.messages.slice(-40);return m}
function forge(to=state.active){state.unknown++;state.messages.push({id:'m'+(++state.messageSerial)+'-'+Date.now().toString(36),from:'?',to,author:'nobody',text:nobody[Math.floor(Math.random()*nobody.length)],kind:'unknown',payload:{},created:Date.now(),arriveAt:Date.now()+700+Math.random()*2500,status:'inflight',read:false,kept:false,forged:true,x:10+Math.random()*80,y:14+Math.random()*68});state.messages=state.messages.slice(-40)}
function deliver(){for(let m of state.messages)if(m.status==='inflight'&&Date.now()>=m.arriveAt){m.status='arrived';if(m.to===state.active)$('#message').textContent=m.forged?'A message arrived with no sender.':'A message arrived from reality '+m.from+'.'}}
function openLetter(m){m.read=true;m.status='read';state.read++;state.currentMessage=m.id;$('#letterFrom').textContent=m.forged?'sender: nobody · origin unavailable':'reality '+m.from+' · '+m.author;$('#letterBody').textContent=m.text;$('#letterMeta').textContent=m.kind+(m.replyTo?' · reply to '+m.replyTo:'')+(m.forged?' · no matching send event':'');$('#letterPanel').classList.add('open');save();render()}
function letter(){return state.messages.find(m=>m.id===state.currentMessage)}function closeLetter(){state.currentMessage=null;$('#letterPanel').classList.remove('open');save()}
function keepLetter(){let m=letter();if(!m)return;m.kept=true;m.status='kept';if(m.kind==='origin')evidence(m.author==='echo'?'echo':'thing',7,'a letter claimed the beginning');if(m.kind==='relation'&&Number.isFinite(m.payload.relationship))R().relationship=clamp(R().relationship+Math.sign(m.payload.relationship-R().relationship)*5,-100,100);if(m.kind==='memory'&&m.payload.place){let p=clone(m.payload.place);p.id='letter-'+Date.now().toString(36);p.name='letter: '+p.name;p.disputed=true;R().places.push(p);R().disputes++}if(m.kind==='future')spawnFuture(m.payload.future?.kind);if(m.forged){R().timelineDrift+=4;R().disputes++;addPlace('dream','unsigned sentence')}closeLetter();render()}
function rejectLetter(){let m=letter();if(!m)return;m.kept=true;m.status='rejected';R().timelineDrift++;closeLetter();render()}
function replyLetter(){let m=letter();if(!m)return;let x=makeMessage(state.active,m.forged?otherId():m.from,R(),m.kind,m.id);x.text=m.forged?['Who are you?','Which room are you in?','Prove it.'][Math.floor(Math.random()*3)]:['I remember it differently.','That is not true here.','Come look for yourself.'][Math.floor(Math.random()*3)];m.kept=true;m.status='replied';state.replies++;closeLetter();render()}
function otherWrites(){let o=O(),kind=Math.abs(o.echoClaim-o.thingClaim)>35?'origin':Math.abs(o.relationship-R().relationship)>25?'relation':o.places.length>R().places.length+2?'memory':o.futures.some(f=>f.status==='pending')?'future':'rift';makeMessage(otherId(),state.active,o,kind)}
function tickOther(){let o=O(),x=Math.random();if(x<.3)o.relationship=clamp(o.relationship+(Math.random()<.5?-3:3),-100,100);else if(x<.55)(Math.random()<.5?o.thingClaim++:o.echoClaim++);else if(x<.75)o.timelineDrift++;else if(o.places.length)addPlace(['warm','cold','dream'][Math.floor(Math.random()*3)],'unseen '+names.dream[Math.floor(Math.random()*names.dream.length)],o);if(Math.random()<.22)otherWrites()}
function cross(){state.active=otherId();state.crossings++;R().timelineDrift++;$('#letterPanel').classList.remove('open');$('#memoryPanel').classList.remove('open');$('#message').textContent='Reality '+state.active+' insists it was always this room.';save();render()}
function realityDistance(){let a=state.realities.A,b=state.realities.B,d=Math.abs(a.relationship-b.relationship)*.25+Math.abs(a.thingClaim-b.thingClaim)*.08+Math.abs(a.echoClaim-b.echoClaim)*.08+Math.abs(a.timelineDrift-b.timelineDrift)*.3+Math.abs(a.places.length-b.places.length)*3;if(a.identityOwner!==b.identityOwner)d+=18;return clamp(Math.round(d),0,100)}
function bleed(){let o=O(),r=R();state.bleeds++;r.timelineDrift+=2;r.disputes++;if(o.places.length&&Math.random()<.5){let p=clone(o.places[Math.floor(Math.random()*o.places.length)]);p.id='bleed-'+Date.now().toString(36);p.name='bleed: '+p.name;p.disputed=true;r.places.push(p)}else r.relationship=clamp(r.relationship+Math.sign(o.relationship-r.relationship)*4,-100,100);if(Math.random()<.35)makeMessage(otherId(),state.active,o,'rift')}
function render(){let r=R();$('#realityStat').textContent=state.active;$('#touches').textContent=r.touches;$('#echoTouches').textContent=r.echoTouches;$('#crossings').textContent=state.crossings;$('#letterCount').textContent=state.messages.filter(m=>m.to===state.active&&['arrived','read'].includes(m.status)&&!m.kept).length;$('#unknownCount').textContent=state.unknown;$('#relationship').textContent='relationship: '+rel(r)+' ('+(r.relationship>0?'+':'')+r.relationship+')';$('#identity').textContent='identity: '+identity(r)+' · larger '+Math.round(r.thingClaim)+' · smaller '+Math.round(r.echoClaim);$('#timeline').textContent='history confidence '+certainty(r)+'% · divergence '+realityDistance()+'% · bleeds '+state.bleeds;let p=r.futures.filter(f=>f.status==='pending').sort((a,b)=>b.prob-a.prob)[0];$('#forecast').textContent=p?'strongest future '+Math.round(p.prob*100)+'%: '+p.text:'the future is temporarily blank';let unread=state.messages.filter(m=>m.to===state.active&&m.status==='arrived'&&!m.read).length;$('#correspondence').textContent='correspondence: '+unread+' unread · '+state.read+' read · '+state.replies+' replies · '+state.unknown+' unsigned';$('#rift').dataset.label='cross to reality '+otherId();let owner=r.identityOwner;$('#thing').dataset.role=owner==='thing'?'original?':'echo?';$('#echo').dataset.role=owner==='echo'?'original?':'echo?';$('#thing').style.width=owner==='thing'?'180px':'112px';$('#thing').style.height=$('#thing').style.width;$('#echo').style.width=owner==='echo'?'142px':'72px';$('#echo').style.height=$('#echo').style.width;renderPlaces();renderFutures();renderLetters();save()}
function renderPlaces(){let w=$('#world');w.innerHTML='';for(let p of R().places){let n=document.createElement('i');n.className='mark '+p.type;n.dataset.label=p.name;n.style.left=p.x+'%';n.style.top=p.y+'%';n.onclick=e=>{e.stopPropagation();state.currentMemory=p.id;$('#memoryTitle').textContent=p.name;$('#memoryBody').textContent=p.type==='warm'?'This version remembers closeness.':p.type==='cold'?'This scar remembers separation.':'This dream is not sure which room dreamed it.';$('#memoryMeta').textContent='current '+p.type+' · original '+p.originalType+' · revised '+p.revisions+'x'+(p.claimedBy?' · claimed by '+p.claimedBy:'');$('#memoryPanel').classList.add('open')};w.appendChild(n)}}
function renderFutures(){let w=$('#futures');w.innerHTML='';for(let f of R().futures.filter(x=>x.status==='pending')){let n=document.createElement('i');n.className='future '+(f.believed?'believed':'');n.dataset.label=f.text;n.style.left=f.x+'%';n.style.top=f.y+'%';n.title=Math.round(f.prob*100)+'%';n.onclick=e=>{e.stopPropagation();f.believed++;f.prob=clamp(f.prob+.12,.1,.98);f.dueAt=Math.min(f.dueAt,Date.now()+6000);render()};w.appendChild(n)}}
function renderLetters(){let w=$('#letters');w.innerHTML='';for(let m of state.messages){if(m.to!==state.active||!['arrived','read'].includes(m.status)||m.kept)continue;let n=document.createElement('i');n.className='letter '+(m.read?'read ':'')+(m.forged?'unknown':'');n.dataset.label=m.forged?'from nobody':'from '+m.from;n.style.left=m.x+'%';n.style.top=m.y+'%';n.onclick=e=>{e.stopPropagation();openLetter(m)};w.appendChild(n)}}
function memory(){return R().places.find(p=>p.id===state.currentMemory)}
$('#revise').onclick=()=>{let p=memory();if(!p)return;let opts=['warm','cold','dream'].filter(x=>x!==p.type);p.type=opts[Math.floor(Math.random()*opts.length)];p.name=names[p.type][Math.floor(Math.random()*names[p.type].length)];p.revisions++;p.disputed=true;R().retcons++;R().timelineDrift+=4;R().disputes++;if(Math.random()<.5)evidence(Math.random()<.5?'thing':'echo',6,'a revised memory favored it');if(Math.random()<.5)spawnFuture();$('#memoryPanel').classList.remove('open');render()};
$('#claim').onclick=()=>{let p=memory();if(!p)return;p.claimedBy=Math.random()<.5?'thing':'echo';p.disputed=true;evidence(p.claimedBy,10,'a memory was claimed as proof');$('#memoryPanel').classList.remove('open');render()};$('#crossMemory').onclick=cross;$('#closeMemory').onclick=()=>$('#memoryPanel').classList.remove('open');
$('#keep').onclick=keepLetter;$('#reject').onclick=rejectLetter;$('#reply').onclick=replyLetter;$('#closeLetter').onclick=closeLetter;$('#rift').onclick=cross;$('#signal').onclick=()=>{let m=makeMessage(state.active,otherId(),R());m.text=(R().identityOwner==='echo'?'The one you call the echo says: ':'The one you call original says: ')+m.text.toLowerCase();$('#message').textContent='Something here wrote into the rift.';render()};
$('#thing').onclick=()=>{let r=R();r.touches++;state.lastInteraction=Date.now();evidence('thing',1.5,'you touched the larger one');if(r.touches%6===0)addPlace(Math.random()<.6?'warm':'dream');if(r.touches%5===0)spawnFuture();if(r.touches%9===0)$('#signal').click();render()};$('#echo').onclick=e=>{e.stopPropagation();let r=R();r.echoTouches++;state.lastInteraction=Date.now();evidence('echo',2.2,'you chose the smaller one');r.relationship=clamp(r.relationship+(Math.random()<.62?2:-2),-100,100);if(r.echoTouches%4===0)addPlace(r.relationship>=0?'warm':'cold');if(r.echoTouches%5===0)spawnFuture('identity');render()};document.onmousemove=()=>state.lastInteraction=Date.now();
$('#forget').onclick=()=>{for(let i=2;i<=11;i++)localStorage.removeItem('nothing-state-v'+i);location.reload()};
setInterval(()=>{deliver();let r=R();for(let f of r.futures.filter(x=>x.status==='pending'))if(Date.now()>=f.dueAt)resolveFuture(f,r);if(r.futures.filter(f=>f.status==='pending').length<2&&Math.random()<.04)spawnFuture();if(Math.random()<.07)tickOther();let d=realityDistance();if(Math.random()<.008+d/1800)otherWrites();if(Math.random()<.003+d/5500)forge(Math.random()<.75?state.active:otherId());if(d>25&&Math.random()<d/1100)bleed();if(Date.now()-state.lastInteraction>9000&&Math.random()<.12){r.dreams++;addPlace('dream');if(Math.random()<.25)spawnFuture();if(Math.random()<.12)forge(state.active);state.lastInteraction=Date.now()}render()},1000);
if(!R().futures.some(f=>f.status==='pending'))spawnFuture();if(!state.messages.length)makeMessage(otherId(),state.active,O(),'rift');render();
