<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nothing — Build 5</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#0d0f14;color:#eef1f6}*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 44%,#141725 0,#0d0f14 58%,#08090d 100%);transition:background 1.4s ease,filter 1.4s ease}#world{position:fixed;inset:0;overflow:hidden;z-index:0}#weather{position:absolute;inset:0;pointer-events:none;opacity:.35;transition:opacity 1s ease}.mark{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:default;border-radius:50%;transition:opacity 1s ease,transform 1s ease}.mark::after{content:attr(data-name);position:absolute;left:12px;top:-4px;font-size:9px;white-space:nowrap;opacity:.2}.mark.warm{width:10px;height:10px;border:1px solid rgba(188,185,255,.32);box-shadow:0 0 18px rgba(155,145,255,.22)}.mark.cold{width:9px;height:9px;border:1px solid rgba(255,130,155,.3);box-shadow:0 0 18px rgba(255,90,125,.18)}.mark.dream{width:7px;height:7px;border:1px dashed rgba(170,220,255,.34);box-shadow:0 0 20px rgba(120,190,255,.17)}.ripple{position:absolute;width:8px;height:8px;border:1px solid rgba(255,255,255,.18);border-radius:50%;transform:translate(-50%,-50%);animation:ripple 3s ease-out forwards;pointer-events:none}.rain{position:absolute;width:1px;height:18px;background:rgba(200,210,255,.18);animation:fall linear forwards;pointer-events:none}@keyframes ripple{to{width:180px;height:180px;opacity:0}}@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(110vh)}}
#app{width:min(94vw,840px);text-align:center;position:relative;z-index:10}h1{font-size:clamp(44px,9vw,96px);margin:0 0 8px;letter-spacing:-.07em}.sub{opacity:.5;margin-bottom:18px}#stage{width:420px;max-width:92vw;height:285px;margin:0 auto;position:relative}#link{position:absolute;height:1px;transform-origin:0 50%;pointer-events:none;z-index:0;transition:opacity .6s ease,background .8s ease,box-shadow .8s ease}#thing,#echo{position:absolute;cursor:pointer;user-select:none;transition:transform .25s ease,filter .5s ease,border-radius .6s ease,width .7s ease,height .7s ease,box-shadow 1s ease,left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),opacity 1s ease}#thing{width:180px;height:180px;left:100px;top:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.88),transparent 8%),radial-gradient(circle at 50% 55%,#8a7dff,#4134b9 55%,#17132c 100%);box-shadow:0 0 80px rgba(128,110,255,.3);z-index:2}#thing:hover{transform:scale(1.04)}#thing:active{transform:scale(.96)}#eye{position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;top:46px;left:86px;opacity:0;transition:opacity .3s ease,transform .15s ease;box-shadow:0 0 10px rgba(255,255,255,.65)}#echo{width:72px;height:72px;left:305px;top:166px;border-radius:50%;background:radial-gradient(circle at 36% 31%,rgba(255,255,255,.7),transparent 9%),radial-gradient(circle at 50% 55%,#6d67ae,#2f2b62 58%,#11101a 100%);box-shadow:0 0 35px rgba(120,115,200,.18);opacity:0;pointer-events:none;z-index:1}#echo.alive{opacity:.75;pointer-events:auto}#echo:hover{transform:scale(1.08)}#echo:active{transform:scale(.9)}#echo-eye{position:absolute;width:5px;height:5px;background:white;border-radius:50%;top:18px;left:34px;opacity:.65}#message{min-height:46px;font-size:18px;opacity:.9}.stats{margin-top:17px;display:flex;justify-content:center;gap:16px;opacity:.48;font-size:12px;flex-wrap:wrap}#relationship,#roomstatus{margin-top:11px;font-size:11px;opacity:.38;min-height:16px}#meter{width:min(270px,70vw);height:3px;margin:6px auto 0;background:rgba(255,255,255,.07);position:relative;border-radius:99px;overflow:hidden}#meter::after{content:'';position:absolute;left:50%;top:0;width:1px;height:100%;background:rgba(255,255,255,.18)}#fill{position:absolute;top:0;height:100%;transition:left .7s ease,width .7s ease,background .7s ease}#memory{margin:9px auto 0;max-width:590px;min-height:16px;font-size:10px;opacity:.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}button{margin-top:20px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:inherit;padding:9px 13px;border-radius:10px;cursor:pointer;font:inherit}button:hover{background:rgba(255,255,255,.09)}#whisper{position:fixed;pointer-events:none;opacity:0;font-size:11px;transition:opacity .7s ease;z-index:15}#corner{position:fixed;left:16px;bottom:13px;font-size:9px;opacity:.22;z-index:12}
</style>
</head>
<body>
<div id="world"><div id="weather"></div></div>
<main id="app">
<h1>nothing</h1>
<div class="sub">build 5 — the room remembers</div>
<div id="stage"><div id="link"></div><div id="thing"><div id="eye"></div></div><div id="echo"><div id="echo-eye"></div></div></div>
<div id="message">The space around them has started paying attention.</div>
<div class="stats"><span>touches <b id="touches">0</b></span><span>mood <b id="mood">unclear</b></span><span>visits <b id="visits">1</b></span><span>dreams <b id="dreams">0</b></span><span>echo <b id="echoes">—</b></span><span>places <b id="places">0</b></span></div>
<div id="relationship"></div><div id="meter"><div id="fill"></div></div><div id="roomstatus"></div><div id="memory"></div><button id="forget">make everything forget</button>
</main>
<div id="whisper"></div><div id="corner">environmental memory active</div>
<script>
const $=s=>document.querySelector(s),world=$('#world'),weather=$('#weather'),stage=$('#stage'),thing=$('#thing'),echo=$('#echo'),eye=$('#eye'),link=$('#link'),message=$('#message'),touchesEl=$('#touches'),moodEl=$('#mood'),visitsEl=$('#visits'),dreamsEl=$('#dreams'),echoesEl=$('#echoes'),placesEl=$('#places'),relationshipEl=$('#relationship'),roomstatus=$('#roomstatus'),fill=$('#fill'),memoryEl=$('#memory'),forget=$('#forget'),whisper=$('#whisper');
const moods=['unclear','curious','suspicious','pleased','restless','dramatic','philosophical','hungry','electric','quiet','elsewhere','nostalgic for nothing'];
const words=['again','door','maybe','blue','inside','quiet','why','almost','remember','elsewhere','later','signal','you','still','us','apart','here'];
const namesWarm=['soft spot','truce','near place','shared corner','almost home','warm patch'];
const namesCold=['bad ground','argument','scar','avoid this','split','cold patch'];
const namesDream=['elsewhere','sleep mark','blue place','afterimage','dream residue'];
let v4=JSON.parse(localStorage.getItem('nothing-state-v4')||'null');let v3=JSON.parse(localStorage.getItem('nothing-state-v3')||'null');let state=JSON.parse(localStorage.getItem('nothing-state-v5')||'null')||v4||v3||{};
state.touches??=0;state.born??=Date.now();state.mood??='unclear';state.shape??=50;state.visitCount??=0;state.dreams??=0;state.memories??=[];state.lastSeen??=0;state.echoBorn??=false;state.echoTouches??=0;state.echoMood??='watching';state.echoDefiance??=0;state.relationship??=0;state.encounters??=0;state.sharedDreams??=0;state.places??=[];state.roomMood??='blank';state.weather??='still';state.roomEvents??=0;
const returning=state.lastSeen&&Date.now()-state.lastSeen>12000;state.visitCount++;if(returning)remember('you came back');
let lastInteraction=Date.now(),dreaming=false,dreamTimer=null,echoTimer=null,relationTimer=null,weatherTimer=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function remember(t){state.memories.push(t);state.memories=state.memories.slice(-10)}function save(){state.lastSeen=Date.now();localStorage.setItem('nothing-state-v5',JSON.stringify(state))}
function relLabel(){let r=state.relationship;return r>=70?'inseparable':r>=35?'fond':r>=12?'warming':r>-12?'uncertain':r>-35?'uneasy':r>-70?'hostile':'nemeses'}
function roomLabel(){if(state.places.length===0)return'blank';let warm=state.places.filter(p=>p.type==='warm').length,cold=state.places.filter(p=>p.type==='cold').length,dream=state.places.filter(p=>p.type==='dream').length;if(dream>warm&&dream>cold)return'dream-soaked';if(warm>=cold+3)return'gentle';if(cold>=warm+3)return'tense';if(state.places.length>12)return'crowded with history';return'mixed'}
function nameFor(type){let a=type==='warm'?namesWarm:type==='cold'?namesCold:namesDream;return a[Math.floor(Math.random()*a.length)]}
function leaveMark(type,x,y,name){if(state.places.length>=28)state.places.shift();state.places.push({type,x:clamp(x,4,96),y:clamp(y,5,95),name:name||nameFor(type),born:Date.now()});state.roomEvents++;state.roomMood=roomLabel();save();renderWorld()}
function markAtEntities(type){let a=thing.getBoundingClientRect(),b=echo.getBoundingClientRect(),x=((a.left+a.width/2+b.left+b.width/2)/2)/innerWidth*100,y=((a.top+a.height/2+b.top+b.height/2)/2)/innerHeight*100;leaveMark(type,x,y)}
function renderWorld(){world.querySelectorAll('.mark').forEach(n=>n.remove());state.places.forEach((p,i)=>{let d=document.createElement('div');d.className='mark '+p.type;d.style.left=p.x+'%';d.style.top=p.y+'%';d.dataset.name=p.name;d.title=p.name;d.addEventListener('mouseenter',()=>{message.textContent=`The room remembers: ${p.name}.`;ripple(p.x,p.y)});world.appendChild(d)});placesEl.textContent=state.places.length;roomstatus.textContent=`room: ${roomLabel()} · weather: ${state.weather} · remembered events: ${state.roomEvents}`;let rm=roomLabel();document.body.style.background=rm==='gentle'?'radial-gradient(circle at 50% 44%,#17172a 0,#0d0f14 60%,#08090d 100%)':rm==='tense'?'radial-gradient(circle at 50% 44%,#221319 0,#0d0f14 62%,#08090d 100%)':rm==='dream-soaked'?'radial-gradient(circle at 50% 44%,#101d2a 0,#0d0f14 62%,#08090d 100%)':'radial-gradient(circle at 50% 44%,#141725 0,#0d0f14 58%,#08090d 100%)'}
function ripple(x,y){let r=document.createElement('div');r.className='ripple';r.style.left=x+'%';r.style.top=y+'%';world.appendChild(r);setTimeout(()=>r.remove(),3100)}
function whisperText(t){whisper.textContent=t;whisper.style.left=(10+Math.random()*80)+'vw';whisper.style.top=(10+Math.random()*80)+'vh';whisper.style.opacity=.45;setTimeout(()=>whisper.style.opacity=0,900)}
function drawLink(){if(!state.echoBorn){link.style.opacity=0;return}let sr=stage.getBoundingClientRect(),a=thing.getBoundingClientRect(),b=echo.getBoundingClientRect(),ax=a.left-sr.left+a.width/2,ay=a.top-sr.top+a.height/2,bx=b.left-sr.left+b.width/2,by=b.top-sr.top+b.height/2,dx=bx-ax,dy=by-ay,d=Math.hypot(dx,dy);link.style.left=ax+'px';link.style.top=ay+'px';link.style.width=d+'px';link.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;link.style.opacity=.08+Math.abs(state.relationship)/180;link.style.background=state.relationship>=0?'rgba(195,190,255,.55)':'rgba(255,150,170,.45)';link.style.boxShadow=Math.abs(state.relationship)>70?'0 0 10px rgba(190,185,255,.45)':'none'}
function render(){touchesEl.textContent=state.touches;moodEl.textContent=state.mood;visitsEl.textContent=state.visitCount;dreamsEl.textContent=state.dreams;echoesEl.textContent=state.echoBorn?`${state.echoTouches}/${state.echoMood}`:'—';thing.style.borderRadius=state.shape+'%';let hue=(245+state.touches*13+state.dreams*9)%360;thing.style.filter=`hue-rotate(${hue-245}deg)`;echo.classList.toggle('alive',state.echoBorn);if(state.echoBorn)echo.style.filter=`hue-rotate(${(hue+(state.relationship<0?90:state.echoTouches*17))%360-245}deg)`;relationshipEl.textContent=state.echoBorn?`relationship: ${relLabel()} (${state.relationship>0?'+':''}${state.relationship}) · encounters ${state.encounters} · shared dreams ${state.sharedDreams}`:'';let pct=Math.abs(state.relationship)/2;fill.style.width=pct+'%';fill.style.left=state.relationship>=0?'50%':(50-pct)+'%';fill.style.background=state.relationship>=0?'rgba(190,185,255,.65)':'rgba(255,145,170,.62)';memoryEl.textContent=state.memories.length?'memory: '+state.memories.join(' · '):'';renderWorld();requestAnimationFrame(drawLink)}
function birthEcho(){if(state.echoBorn)return;if(state.touches>=12||state.dreams>=3||state.visitCount>=4){state.echoBorn=true;remember('something else appeared');message.textContent='There are two now.';startEcho();startRelationship();save();render()}}
function adjustRel(d,reason){let before=relLabel();state.relationship=clamp(state.relationship+d,-100,100);let after=relLabel();if(reason)remember(reason);if(before!==after)message.textContent=`They are ${after} now.`;save();render()}
function wanderEcho(){if(!state.echoBorn)return;let positive=state.relationship>20,negative=state.relationship<-20;if(positive){let a=thing.getBoundingClientRect(),sr=stage.getBoundingClientRect();echo.style.left=clamp(a.left-sr.left+a.width*.72+Math.random()*45,8,340)+'px';echo.style.top=clamp(a.top-sr.top+a.height*.55+Math.random()*55,25,210)+'px'}else if(negative){echo.style.left=(Math.random()<.5?8:330)+'px';echo.style.top=(35+Math.random()*180)+'px'}else{echo.style.left=(15+Math.random()*320)+'px';echo.style.top=(35+Math.random()*185)+'px'}setTimeout(drawLink,950)}
function echoCopy(){if(!state.echoBorn)return;if(Math.random()<.18+state.echoDefiance*.005){state.echoDefiance++;state.echoMood='defiant';message.textContent='The echo refused.';adjustRel(-3,'echo refused');if(Math.random()<.35)markAtEntities('cold')}else{state.echoMood=['copying','watching','late','uncertain'][Math.floor(Math.random()*4)];echo.style.transform='scale(.82)';setTimeout(()=>echo.style.transform='',180);adjustRel(1,'echo copied');}}
function encounter(){if(!state.echoBorn)return;state.encounters++;let roll=Math.random();if(state.relationship>30&&roll<.6){adjustRel(3,'they found each other');message.textContent='They stayed close for a moment.';markAtEntities('warm')}else if(state.relationship<-25&&roll<.65){adjustRel(-4,'they fought');message.textContent='The room felt that.';markAtEntities('cold');weatherBurst('rain')}else if(roll<.2){adjustRel(Math.random()<.5?2:-2,'an ambiguous encounter')}wanderEcho()}
function sharedDream(){if(!state.echoBorn||state.relationship<55||Math.random()>.28)return;state.sharedDreams++;remember('shared dream');markAtEntities('dream');whisperText('same dream');message.textContent='They dreamed the same place.';adjustRel(2)}
function dream(){state.dreams++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=25+Math.floor(Math.random()*50);remember('dreamed '+words[Math.floor(Math.random()*words.length)]);if(Math.random()<.25)leaveMark('dream',10+Math.random()*80,10+Math.random()*80);birthEcho();sharedDream();save();render()}
function beginDream(){if(dreaming)return;dreaming=true;state.weather='haze';renderWorld();dream();dreamTimer=setInterval(()=>{if(Math.random()<.5)dream();if(state.echoBorn&&Math.random()<.4)wanderEcho()},2800)}function wake(){dreaming=false;clearInterval(dreamTimer);state.weather='still';message.textContent=state.echoBorn?'Both noticed you return.':'It noticed you return.';save();renderWorld()}
function weatherBurst(kind){state.weather=kind;renderWorld();if(kind==='rain'){for(let i=0;i<24;i++){let d=document.createElement('div');d.className='rain';d.style.left=Math.random()*100+'%';d.style.top=(-20-Math.random()*50)+'px';d.style.animationDuration=(1.2+Math.random()*1.5)+'s';weather.appendChild(d);setTimeout(()=>d.remove(),3000)}}clearTimeout(weatherTimer);weatherTimer=setTimeout(()=>{state.weather=dreaming?'haze':'still';save();renderWorld()},3200)}
function startEcho(){clearInterval(echoTimer);if(!state.echoBorn)return;echoTimer=setInterval(()=>{if(Date.now()-lastInteraction>1800)wanderEcho();if(Math.random()<.14)echoCopy()},3100)}function startRelationship(){clearInterval(relationTimer);if(!state.echoBorn)return;relationTimer=setInterval(()=>{if(Math.random()<.48)encounter();if(Math.random()<.08&&state.relationship>40)markAtEntities('warm');if(Math.random()<.08&&state.relationship<-40)markAtEntities('cold')},5200)}
function interact(){lastInteraction=Date.now();if(dreaming)wake()}
thing.addEventListener('click',()=>{interact();state.touches++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=30+Math.floor(Math.random()*40);remember('touch '+state.touches);message.textContent=['Okay.','Again?','The room noticed.','That left almost no trace.','The other one saw that.'][Math.floor(Math.random()*5)];birthEcho();if(state.echoBorn)setTimeout(echoCopy,500+Math.random()*900);if(state.touches%9===0)leaveMark(state.relationship>=0?'warm':'cold',15+Math.random()*70,15+Math.random()*70,'touch residue');save();render()});
echo.addEventListener('click',e=>{e.stopPropagation();interact();state.echoTouches++;state.echoMood=['surprised','annoyed','pleased','awake'][Math.floor(Math.random()*4)];remember('echo touch '+state.echoTouches);message.textContent='The original noticed you chose the echo.';adjustRel(Math.random()<.55?-1:1);if(state.echoTouches%4===0)leaveMark('cold',15+Math.random()*70,15+Math.random()*70,'jealous spot');wanderEcho();save();render()});
world.addEventListener('click',e=>{if(e.target.classList.contains('mark'))return;interact();let x=e.clientX/innerWidth*100,y=e.clientY/innerHeight*100;ripple(x,y);if(Math.random()<.18&&state.places.length){let p=state.places[Math.floor(Math.random()*state.places.length)];message.textContent=`Something in the room points toward ${p.name}.`}});
document.addEventListener('mousemove',()=>{lastInteraction=Date.now()});document.addEventListener('keydown',()=>{interact();if(Math.random()<.15)whisperText('heard that')});
forget.addEventListener('click',()=>{['nothing-state-v2','nothing-state-v3','nothing-state-v4','nothing-state-v5'].forEach(k=>localStorage.removeItem(k));clearInterval(echoTimer);clearInterval(relationTimer);clearInterval(dreamTimer);state={touches:0,born:Date.now(),mood:'unclear',shape:50,visitCount:1,dreams:0,memories:[],lastSeen:Date.now(),echoBorn:false,echoTouches:0,echoMood:'watching',echoDefiance:0,relationship:0,encounters:0,sharedDreams:0,places:[],roomMood:'blank',weather:'still',roomEvents:0};dreaming=false;message.textContent='Everything forgot. Even the room.';save();render()});
setInterval(()=>{if(!dreaming&&Date.now()-lastInteraction>9000)beginDream()},1000);window.addEventListener('resize',drawLink);window.addEventListener('beforeunload',save);birthEcho();if(state.echoBorn){startEcho();startRelationship()}save();render();
</script>
</body>
</html>
