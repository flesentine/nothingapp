<main id="app"><h1>nothing</h1><div class="sub">build 8 — the future has started making demands</div><div id="stage"><div id="link"></div><div id="thing"><div id="eye"></div></div><div id="echo"></div></div><div id="message">The room has begun predicting what happens next.</div><div class="stats"><span>touches <b id="touches">0</b></span><span>mood <b id="mood">unclear</b></span><span>visits <b id="visits">1</b></span><span>dreams <b id="dreams">0</b></span><span>retcons <b id="retcons">0</b></span><span>futures <b id="futures">0</b></span></div><div id="relationship"></div><div id="meter"><div id="fill"></div></div><div id="roomstatus"></div><div id="timeline"></div><div id="forecast"></div><div id="memory"></div><button class="forget" id="forget">make it forget</button></main>

<script>
const $=s=>document.querySelector(s);const world=$('#world'),futureField=$('#future-field'),stage=$('#stage'),link=$('#link'),thing=$('#thing'),echo=$('#echo'),msg=$('#message'),touchesEl=$('#touches'),moodEl=$('#mood'),visitsEl=$('#visits'),dreamsEl=$('#dreams'),retconsEl=$('#retcons'),futuresEl=$('#futures'),relationshipEl=$('#relationship'),roomstatus=$('#roomstatus'),timelineEl=$('#timeline'),forecastEl=$('#forecast'),fill=$('#fill'),memoryEl=$('#memory'),whisper=$('#whisper'),flash=$('#flash'),flashText=$('#flash-text'),inside=$('#inside'),insideField=$('#inside-field'),insideName=$('#inside-name'),insideOrb=$('#inside-orb'),insideText=$('#inside-text'),insideHistory=$('#inside-history'),insideCount=$('#inside-count');
const moods=['unclear','curious','suspicious','pleased','restless','dramatic','philosophical','hungry','electric','quiet','elsewhere','nostalgic for nothing','certain about something false','afraid of next week'];const words=['again','door','maybe','blue','before','inside','quiet','why','almost','remember','elsewhere','later','warm','zero','signal','you','still','us','apart','tomorrow'];const names={warm:['almost home','soft corner','near enough','the good minute','small truce'],cold:['bad ground','the argument','red distance','do not stand here','the bruise'],dream:['afterimage','blue maybe','sleep residue','the other room','almost elsewhere']};const futureDefs=[{kind:'reconcile',text:'they will forgive something',base:.56},{kind:'fight',text:'they will make a new scar',base:.48},{kind:'merge',text:'the echo will become too similar',base:.34},{kind:'distance',text:'one of them will refuse the other',base:.43},{kind:'dream',text:'they will share a dream that remembers tomorrow',base:.39},{kind:'portal',text:'a place that does not exist yet will open',base:.37},{kind:'silence',text:'nothing will happen for a while',base:.30}];
let previous=JSON.parse(localStorage.getItem('nothing-state-v7')||'null')||JSON.parse(localStorage.getItem('nothing-state-v6')||'null')||{};let state=JSON.parse(localStorage.getItem('nothing-state-v8')||'null')||previous;state.touches??=0;state.born??=Date.now();state.mood??='unclear';state.shape??=50;state.visitCount??=0;state.dreams??=0;state.memories??=[];state.lastSeen??=0;state.echoBorn??=false;state.echoTouches??=0;state.echoMood??='watching';state.relationship??=0;state.encounters??=0;state.sharedDreams??=0;state.places??=[];state.portalTrips??=0;state.leaks??=0;state.retcons??=0;state.disputes??=0;state.timelineDrift??=0;state.revisionLog??=[];state.futures??=[];state.futureSerial??=0;state.fulfilledFutures??=0;state.failedFutures??=0;state.beliefs??=0;state.places=state.places.map((p,i)=>({id:p.id||('p'+i),type:p.type||'dream',originalType:p.originalType||p.type||'dream',name:p.name||'unnamed memory',originalName:p.originalName||p.name||'unnamed memory',x:Number.isFinite(p.x)?p.x:10+Math.random()*80,y:Number.isFinite(p.y)?p.y:10+Math.random()*80,strength:p.strength||1,visits:p.visits||0,entered:p.entered||0,created:p.created||Date.now(),portal:!!p.portal,revisions:p.revisions||0,disputed:!!p.disputed}));state.futures=state.futures.map((f,i)=>({id:f.id||('f'+i),kind:f.kind||'dream',text:f.text||'something will happen',prob:Number.isFinite(f.prob)?f.prob:.5,believed:f.believed||0,status:f.status||'pending',created:f.created||Date.now(),dueTouches:Number.isFinite(f.dueTouches)?f.dueTouches:state.touches+4,dueAt:f.dueAt||Date.now()+20000,x:Number.isFinite(f.x)?f.x:10+Math.random()*80,y:Number.isFinite(f.y)?f.y:10+Math.random()*70}));const returning=state.lastSeen&&Date.now()-state.lastSeen>12000;state.visitCount++;let lastInteraction=Date.now(),currentPlace=null,dreaming=false,dreamTimer=null,echoTimer=null,relationTimer=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function remember(t){state.memories.push(t);state.memories=state.memories.slice(-12)}if(returning)remember('you came back');function save(){state.lastSeen=Date.now();localStorage.setItem('nothing-state-v8',JSON.stringify(state))}function relLabel(){let r=state.relationship;return r>=70?'inseparable':r>=35?'fond':r>=12?'warming':r>-12?'uncertain':r>-35?'uneasy':r>-70?'hostile':'nemeses'}function certainty(){return clamp(100-state.timelineDrift-state.disputes*3-state.futures.filter(f=>f.status==='failed').length,5,100)}function whisperText(t){whisper.textContent=t;whisper.style.left=(8+Math.random()*84)+'vw';whisper.style.top=(8+Math.random()*82)+'vh';whisper.style.opacity=.5;setTimeout(()=>whisper.style.opacity=0,950)}function flashIt(t){flashText.textContent=t;flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show')}
function addPlace(type,name,x,y,strength=1){let p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type,originalType:type,name:name||names[type][Math.floor(Math.random()*names[type].length)],originalName:name||'',x:x??(8+Math.random()*84),y:y??(8+Math.random()*80),strength,visits:0,entered:0,created:Date.now(),portal:false,revisions:0,disputed:false};if(!p.originalName)p.originalName=p.name;state.places.push(p);state.places=state.places.slice(-32);remember('room kept '+p.name);save();renderPlaces();render();return p}function renderPlaces(){world.innerHTML='';for(let p of state.places){let n=document.createElement('div');n.className='mark '+p.type+(p.portal?' portal':'')+(p.revisions?' revised':'')+(p.disputed?' disputed':'');n.dataset.name=p.name;n.style.left=p.x+'%';n.style.top=p.y+'%';n.style.opacity=clamp(.25+p.strength*.09,.25,.75);n.onclick=e=>{e.stopPropagation();p.visits++;p.strength=clamp(p.strength+.15,1,8);if(p.portal||maybePortal(p))enterPlace(p);else{msg.textContent='The room currently remembers '+p.name+'.';remember('visited '+p.name);save();renderPlaces();render()}};world.appendChild(n)}}function maybePortal(p){if(p.portal)return true;let chance=p.visits*.2+p.strength*.09+(p.type==='dream'?.16:0)+p.revisions*.08;if(chance>.62||Math.random()<chance*.16){p.portal=true;remember(p.name+' opened');save();renderPlaces();return true}return false}
function spawnFuture(forceKind){let def=forceKind?futureDefs.find(d=>d.kind===forceKind):futureDefs[Math.floor(Math.random()*futureDefs.length)];if(!def)return;let instability=(100-certainty())/250;let relationBias=def.kind==='reconcile'?Math.max(0,-state.relationship)/250:def.kind==='fight'?Math.max(0,state.relationship)/300:0;let f={id:'f'+(++state.futureSerial)+'-'+Date.now().toString(36),kind:def.kind,text:def.text,prob:clamp(def.base+instability+relationBias+(Math.random()-.5)*.14,.12,.92),believed:0,status:'pending',created:Date.now(),dueTouches:state.touches+3+Math.floor(Math.random()*6),dueAt:Date.now()+12000+Math.random()*22000,x:8+Math.random()*82,y:8+Math.random()*70};state.futures.push(f);state.futures=state.futures.slice(-14);remember('future appeared: '+f.text);msg.textContent='A possible future appeared.';save();renderFutures();render()}function believeFuture(f){if(f.status!=='pending')return;f.believed++;state.beliefs++;f.prob=clamp(f.prob+.11,.05,.97);f.dueTouches=Math.max(state.touches+1,f.dueTouches-1);f.dueAt=Math.min(f.dueAt,Date.now()+9000);remember('believed '+f.text);msg.textContent='You made that future more likely.';whisperText('thank you');nudgeFuture(f,true);save();renderFutures();render()}function nudgeFuture(f,fromBelief=false){if(f.status!=='pending')return;let strength=(fromBelief?.7:.25)+f.believed*.1;if(Math.random()>strength)return;if(f.kind==='reconcile')adjustRel(1,'future pulled them together');if(f.kind==='fight')adjustRel(-1,'future sharpened the room');if(f.kind==='distance'){echo.style.left=(20+Math.random()*80)+'px';echo.style.top=(150+Math.random()*60)+'px'}if(f.kind==='merge'){echo.style.filter=thing.style.filter;if(Math.random()<.25)state.echoMood='too similar'}if(f.kind==='portal'&&state.places.length){let p=state.places[Math.floor(Math.random()*state.places.length)];p.portal=true}if(f.kind==='dream'&&Math.random()<.3)addPlace('dream','tomorrow leaking backward')}
function resolveFuture(f){if(f.status!=='pending')return;let success=Math.random()<f.prob;f.status=success?'fulfilled':'failed';if(success){state.fulfilledFutures++;remember('future came true: '+f.text);flashIt('it happened: '+f.text);if(f.kind==='reconcile'){adjustRel(8,'prophecy fulfilled');addPlace('warm','the predicted truce')}if(f.kind==='fight'){adjustRel(-8,'prophecy fulfilled');addPlace('cold','the predicted scar')}if(f.kind==='merge'){state.echoMood='mirroring';state.relationship=clamp(state.relationship+4,-100,100);echo.style.filter=thing.style.filter}if(f.kind==='distance'){adjustRel(-5,'prophecy fulfilled');state.echoMood='far away'}if(f.kind==='dream'){state.sharedDreams++;state.dreams++;addPlace('dream','tomorrow remembered early',undefined,undefined,2)}if(f.kind==='portal'){addPlace('dream','the place that arrived early',undefined,undefined,2).portal=true}if(f.kind==='silence'){msg.textContent='For once, the prophecy was simply quiet.'}}else{state.failedFutures++;state.timelineDrift=clamp(state.timelineDrift+2,0,85);remember('future failed: '+f.text);flashIt('not this future');if(f.believed>1&&Math.random()<.55){f.status='pending';f.prob=clamp(f.prob+.08,.1,.94);f.dueTouches=state.touches+2+Math.floor(Math.random()*4);f.dueAt=Date.now()+9000+Math.random()*12000;remember('future refused to die');whisperText('again')}}save();renderFutures();render()}function renderFutures(){futureField.innerHTML='';for(let f of state.futures){let n=document.createElement('div');n.className='future '+(f.believed?'believed ':'')+(f.status!=='pending'?f.status:'');n.dataset.text=f.text;n.style.left=f.x+'%';n.style.top=f.y+'%';n.style.opacity=f.status==='pending'?clamp(.25+f.prob*.65,.3,.88):.32;n.title=Math.round(f.prob*100)+'% · '+f.status+(f.believed?' · believed '+f.believed+'x':'');n.onclick=e=>{e.stopPropagation();believeFuture(f)};futureField.appendChild(n)}}
function adjustRel(n,why){state.relationship=clamp(state.relationship+n,-100,100);if(Math.abs(n)>=3&&why)remember(why);save();render()}function render(){touchesEl.textContent=state.touches;moodEl.textContent=state.mood;visitsEl.textContent=state.visitCount;dreamsEl.textContent=state.dreams;retconsEl.textContent=state.retcons;futuresEl.textContent=state.futures.filter(f=>f.status==='pending').length;relationshipEl.textContent=state.echoBorn?'relationship: '+relLabel()+' ('+(state.relationship>0?'+':'')+state.relationship+') · encounters '+state.encounters+' · shared dreams '+state.sharedDreams:'';roomstatus.textContent='room: places '+state.places.length+' · portals '+state.places.filter(p=>p.portal).length+' · leaks '+state.leaks;timelineEl.textContent='history confidence '+certainty()+'% · disputes '+state.disputes+' · drift '+state.timelineDrift;let pending=state.futures.filter(f=>f.status==='pending');let strongest=pending.sort((a,b)=>b.prob-a.prob)[0];forecastEl.textContent=strongest?'strongest future '+Math.round(strongest.prob*100)+'%: '+strongest.text:'the future is temporarily blank';memoryEl.textContent=state.memories.join(' · ');thing.style.borderRadius=state.shape+'%';let hue=(245+state.touches*13+state.dreams*9+state.retcons*7+state.fulfilledFutures*11)%360;thing.style.filter='hue-rotate('+(hue-245)+'deg)';echo.classList.toggle('alive',state.echoBorn);let pct=Math.abs(state.relationship)/2;fill.style.width=pct+'%';fill.style.left=state.relationship>=0?'50%':(50-pct)+'%';fill.style.background=state.relationship>=0?'rgba(190,185,255,.65)':'rgba(255,145,170,.6)';requestAnimationFrame(drawLink)}function drawLink(){if(!state.echoBorn){link.style.opacity=0;return}let s=stage.getBoundingClientRect(),a=thing.getBoundingClientRect(),b=echo.getBoundingClientRect(),ax=a.left-s.left+a.width/2,ay=a.top-s.top+a.height/2,bx=b.left-s.left+b.width/2,by=b.top-s.top+b.height/2,dx=bx-ax,dy=by-ay;link.style.left=ax+'px';link.style.top=ay+'px';link.style.width=Math.hypot(dx,dy)+'px';link.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';link.style.opacity=.08+Math.abs(state.relationship)/180;link.style.background=state.relationship>=0?'rgba(195,190,255,.5)':'rgba(255,150,175,.45)'}
function birthEcho(){if(state.echoBorn)return;if(state.touches>=7||state.dreams>=2||state.visitCount>=3){state.echoBorn=true;remember('something else appeared');startEcho();startRelationship();save();render()}}function startEcho(){clearInterval(echoTimer);if(!state.echoBorn)return;echoTimer=setInterval(()=>{if(inside.classList.contains('open'))return;let positive=state.relationship>20;if(positive){echo.style.left=(190+Math.random()*125)+'px';echo.style.top=(80+Math.random()*110)+'px'}else{echo.style.left=(15+Math.random()*375)+'px';echo.style.top=(30+Math.random()*190)+'px'}if(Math.random()<.18)state.echoMood=['watching','restless','elsewhere','thinking about tomorrow'][Math.floor(Math.random()*4)]},3200)}function encounter(){if(!state.echoBorn||inside.classList.contains('open'))return;state.encounters++;if(state.relationship>30&&Math.random()<.48){adjustRel(3,'they found each other');addPlace('warm')}else if(state.relationship<-25&&Math.random()<.48){adjustRel(-4,'they fought');addPlace('cold')}else adjustRel(Math.random()<.52?1:-1);for(let f of state.futures.filter(x=>x.status==='pending'))if(Math.random()<.18)nudgeFuture(f);save();render()}function startRelationship(){clearInterval(relationTimer);if(!state.echoBorn)return;relationTimer=setInterval(encounter,6500)}
function dream(){if(dreaming||inside.classList.contains('open'))return;dreaming=true;state.dreams++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=25+Math.floor(Math.random()*50);let w=words[Math.floor(Math.random()*words.length)];remember('dreamed '+w);if(Math.random()<.48)addPlace('dream',Math.random()<.4?'dream of '+w:null);if(Math.random()<.3)spawnFuture('dream');document.body.style.filter='saturate(.72) brightness(.85)';save();render();dreamTimer=setTimeout(()=>{dreaming=false;document.body.style.filter='';msg.textContent='It woke up remembering tomorrow badly.'},3500)}function interact(){lastInteraction=Date.now();if(dreaming){clearTimeout(dreamTimer);dreaming=false;document.body.style.filter=''}}
thing.onclick=()=>{interact();state.touches++;state.mood=moods[Math.floor(Math.random()*moods.length)];state.shape=30+Math.floor(Math.random()*42);remember('touch '+state.touches);msg.textContent=['Okay.','The future noticed that.','Again?','That may satisfy a prophecy.','This has not happened yet.'][Math.floor(Math.random()*5)];if(state.touches%6===0)addPlace(Math.random()<.55?'warm':'dream');if(state.touches%5===0&&state.futures.filter(f=>f.status==='pending').length<5)spawnFuture();birthEcho();for(let f of state.futures.filter(x=>x.status==='pending')){nudgeFuture(f);if(state.touches>=f.dueTouches||Date.now()>=f.dueAt)resolveFuture(f)}save();render()};echo.onclick=e=>{e.stopPropagation();interact();state.echoTouches++;state.echoMood=['surprised','annoyed','pleased','awake','predicting'][Math.floor(Math.random()*5)];adjustRel(Math.random()<.62?2:-2);if(state.echoTouches%4===0)addPlace(state.relationship>=0?'warm':'cold');if(Math.random()<.24)spawnFuture(state.relationship>=0?'reconcile':'fight');save();render()};document.onmousemove=()=>{if(!inside.classList.contains('open'))interact()};
function seedInside(){insideField.innerHTML='';for(let i=0;i<48;i++){let s=document.createElement('i');s.className='star';let z=1+Math.random()*4;s.style.width=z+'px';s.style.height=z+'px';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.opacity=.12+Math.random()*.5;s.style.setProperty('--s',(1+Math.random()*4)+'s');insideField.appendChild(s)}}function enterPlace(p){currentPlace=p;p.entered++;p.portal=true;state.portalTrips++;insideName.textContent=p.name;insideText.textContent=p.type==='warm'?'This version wants to become kinder.':p.type==='cold'?'The scar is rehearsing another history.':'This dream can see both directions.';insideHistory.textContent='current '+p.type+' · original '+p.originalType+' · revised '+p.revisions+'x · entered '+p.entered+'x';insideCount.textContent='history confidence '+certainty()+'%';inside.style.background=p.type==='cold'?'radial-gradient(circle,#25131d,#08090e 64%)':p.type==='dream'?'radial-gradient(circle,#102131,#08090e 66%)':'radial-gradient(circle,#1b1835,#08090e 66%)';seedInside();inside.classList.add('open');save()}function reviseMemory(p){if(!p)return;let old=p.type,opts=['warm','cold','dream'].filter(t=>t!==old),next=opts[Math.floor(Math.random()*opts.length)];p.type=next;p.name=names[next][Math.floor(Math.random()*names[next].length)];p.revisions++;p.disputed=p.revisions>1||Math.random()<.45;state.retcons++;state.timelineDrift=clamp(state.timelineDrift+3+Math.floor(Math.random()*3),0,85);if(p.disputed)state.disputes++;state.revisionLog.push({at:Date.now(),place:p.id,from:old,to:next});state.revisionLog=state.revisionLog.slice(-22);if(old==='cold'&&next==='warm')adjustRel(5,'history changed');if(old==='warm'&&next==='cold')adjustRel(-5,'history changed');flashIt('correction: '+p.name);insideName.textContent=p.name;insideText.textContent='The future recalculated immediately.';insideHistory.textContent='current '+p.type+' · original '+p.originalType+' · revised '+p.revisions+'x';if(Math.random()<.55)spawnFuture();save();renderPlaces();render()}$('#revise').onclick=()=>reviseMemory(currentPlace);insideOrb.onclick=()=>{if(!currentPlace)return;currentPlace.strength=clamp(currentPlace.strength+.3,1,9);insideOrb.style.borderRadius=(20+Math.random()*60)+'%';if(Math.random()<.28){state.leaks++;insideCount.textContent='something attached itself to you'}if(Math.random()<.22)spawnFuture();save()};function leavePlace(){if(!currentPlace)return;let p=currentPlace;if(state.leaks>0&&Math.random()<.55)addPlace(p.type==='cold'?'dream':p.type,'leak from '+p.name);msg.textContent='You left '+p.name+'. The forecast changed.';currentPlace=null;inside.classList.remove('open');save();renderPlaces();render()}$('#leave').onclick=leavePlace;document.onkeydown=e=>{if(e.key==='Escape'&&inside.classList.contains('open'))leavePlace()};
$('#forget').onclick=()=>{for(let k of ['nothing-state-v2','nothing-state-v3','nothing-state-v4','nothing-state-v5','nothing-state-v6','nothing-state-v7','nothing-state-v8'])localStorage.removeItem(k);clearInterval(echoTimer);clearInterval(relationTimer);state={touches:0,born:Date.now(),mood:'unclear',shape:50,visitCount:1,dreams:0,memories:[],lastSeen:Date.now(),echoBorn:false,echoTouches:0,echoMood:'watching',relationship:0,encounters:0,sharedDreams:0,places:[],portalTrips:0,leaks:0,retcons:0,disputes:0,timelineDrift:0,revisionLog:[],futures:[],futureSerial:0,fulfilledFutures:0,failedFutures:0,beliefs:0};inside.classList.remove('open');msg.textContent='Past and future were both erased.';save();renderPlaces();renderFutures();render()};setInterval(()=>{if(!inside.classList.contains('open')&&Date.now()-lastInteraction>9000&&!dreaming)dream();let pending=state.futures.filter(f=>f.status==='pending');for(let f of pending){if(Math.random()<.12)nudgeFuture(f);if(Date.now()>=f.dueAt||state.touches>=f.dueTouches)resolveFuture(f)}if(pending.length<2&&Math.random()<.045)spawnFuture();if(state.retcons>2&&Math.random()<.02&&state.places.length){let p=state.places[Math.floor(Math.random()*state.places.length)];p.disputed=true;state.disputes++;state.timelineDrift=clamp(state.timelineDrift+1,0,85)}save();render()},1000);window.onbeforeunload=save;birthEcho();if(state.echoBorn){startEcho();startRelationship()}if(!state.futures.length)spawnFuture();renderPlaces();renderFutures();render();save();
</script>
